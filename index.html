<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="深淵環オルビア">
<meta name="theme-color" content="#0a0c13">
<title>深淵環オルビア</title>
<style>
:root{
  --bg:#0a0c13;--panel:#131826;--panel2:#1a2133;--line:#29324a;--text:#e9ecf4;--muted:#8b94aa;
  --red:#f0564f;--blue:#4d8dff;--green:#39c97a;--none:#aab1c2;--gold:#f2c14e;--orb:#7fd8ff;--danger:#ff6b6b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none;font-size:14px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);position:relative;overflow:hidden;
  background:radial-gradient(120% 60% at 50% 0%,#151b2e 0%,var(--bg) 60%)}
.c-red{--c:var(--red)}.c-blue{--c:var(--blue)}.c-green{--c:var(--green)}.c-none{--c:var(--none)}

/* ---------- title ---------- */
.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
.logo{text-align:center;user-select:none;margin-bottom:18px}
.logo .l1{font-size:52px;font-weight:900;letter-spacing:.14em;margin-left:.14em;line-height:1.1;
  background:linear-gradient(180deg,#fff,#7fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .l2{font-size:30px;font-weight:800;letter-spacing:.45em;margin-left:.45em;color:#8a9bc8;line-height:1.4}
.logo .en{font-size:11px;color:var(--muted);letter-spacing:.32em;margin-left:.32em;margin-top:6px}
.lead{color:#c3cadb;font-size:14px;line-height:1.7;text-align:center;max-width:300px;margin:0 0 4px}
.lead span{display:inline-block}   /* 文節の途中で改行しない */
.ver{color:var(--muted);font-size:10px;margin:0 0 10px;opacity:.8}
.sub{color:var(--muted);font-size:12px;margin-bottom:10px}
.btn{display:block;width:100%;max-width:300px;padding:14px;border-radius:12px;background:var(--panel2);
  border:1px solid var(--line);font-weight:700;font-size:16px;text-align:center}
.btn.primary{background:linear-gradient(180deg,#2c6df0,#1d4fc0);border-color:#4d8dff}
.btn.small{padding:9px 12px;font-size:14px;width:auto;display:inline-block}
.btn:disabled{opacity:.4}

/* ---------- battle ---------- */
.battle{flex:1;display:flex;flex-direction:column;min-height:0}
.side{display:flex;flex-direction:column;min-height:0}
.side.op{flex:1;background:linear-gradient(180deg,rgba(150,40,60,.16),rgba(150,40,60,.03) 70%,transparent)}
.side.me{flex:1;background:linear-gradient(0deg,rgba(40,90,190,.18),rgba(40,90,190,.04) 70%,transparent)}
.prow{display:flex;align-items:center;gap:8px;padding:5px 10px}
.side.op .prow{border-bottom:1px solid rgba(255,255,255,.05)}
.side.me .prow{border-top:1px solid rgba(255,255,255,.05)}
.pinfo{flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:3px 9px;font-size:11.5px;min-width:0}
.pname{font-weight:800;font-size:13px}
.turnmark{font-size:10px;background:var(--gold);color:#000;border-radius:4px;padding:1px 4px;margin-left:4px}
.life{display:flex;gap:3px}
.lo{width:11px;height:11px;border-radius:50%;border:1px solid #5a2a2a;display:inline-block}
.lo.on{background:radial-gradient(circle at 35% 35%,#ffb3a8,#e0413a);border-color:#ff8a80}
.stat{color:var(--muted)}.stat b{color:var(--text);margin-left:3px;font-size:13px}
.stat b.orbc{color:var(--orb)}
.zones{display:flex;gap:5px;flex:0 0 auto}
.zone{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:8px;color:var(--muted);width:36px;white-space:nowrap}
.zn{position:relative;width:30px;height:42px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px}
.zn b{position:absolute;right:-3px;bottom:-3px;background:#0b0e16;border:1px solid var(--line);border-radius:7px;font-size:9px;padding:0 3px;line-height:13px;color:var(--text)}
.zempty{border:1.5px dashed #2f3854;color:#3a4462}
.zf{border:2px solid color-mix(in srgb,var(--c) 80%,#000);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 45%,#1a2030),#0f131d);color:color-mix(in srgb,var(--c) 55%,#fff)}
.cback{border:2px solid #4a5b92;background:repeating-linear-gradient(45deg,#1d2747 0 4px,#141b33 4px 8px);color:#8fa4e8}
.cback.burstback{border-color:var(--gold);color:var(--gold)}
.field{flex:1 0 auto;min-height:116px;display:flex;align-items:center;justify-content:center;gap:5px;padding:6px 12px}
.fempty{color:#3d4660;font-size:12px}
.mid{padding:4px 10px;background:#0b0e17;border-top:1px solid var(--line);border-bottom:1px solid var(--line);min-height:52px}
.banner{font-size:12px;font-weight:700;color:var(--gold);margin-bottom:2px;display:flex;justify-content:space-between;gap:6px}
.banner .win{background:var(--gold);color:#000;border-radius:4px;padding:0 5px;font-size:11px;white-space:nowrap}
.logs{font-size:11px;color:var(--muted);line-height:1.45}
.logs div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logs div:last-child{color:var(--text)}
.hand{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;min-height:112px;background:#0f1320;border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}
.actbar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#0b0e17;border-top:1px solid var(--line)}
.phase{flex:1 1 auto;font-size:11px;color:var(--muted);line-height:1.3;min-width:0;overflow:hidden}
.phase b{white-space:nowrap}
.phase b{color:var(--text);font-size:13px;display:block}
.go{flex:0 0 auto;padding:12px 14px;border-radius:10px;background:linear-gradient(180deg,#2c6df0,#1d4fc0);font-weight:800;font-size:14px;white-space:nowrap}
.go.end{background:linear-gradient(180deg,#d9483f,#a8302a)}
.mini{white-space:nowrap;flex:0 0 auto;padding:9px 8px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:700}
.mini:disabled{opacity:.4}

/* 小さい画面（iPhone SE など）向けの詰め */
@media (max-height:700px){
  .field{min-height:100px;padding:4px 10px}
  .sz-unit{height:98px}.sz-unit .cf-art{height:44px}.sz-unit .cf-bp{font-size:14px}
  .hand{min-height:98px;padding:6px 10px}.sz-hand{height:86px}.sz-hand .cf-art{height:28px}
  .mid{min-height:40px}.logs div:nth-last-child(n+3){display:none}
  .prow{padding:4px 10px}.zn{width:26px;height:36px;font-size:11px}.zone{width:32px}
  .actbar{padding:6px 10px}
}
@media (max-width:400px){ .phase .ps{display:none} .go{padding:12px 12px} }
@media (max-width:340px){ .phase{display:none} .actbar{justify-content:flex-end} }
@media (max-width:360px){
  .mini{font-size:11px;padding:8px 6px}
  .go{padding:10px 10px;font-size:13px}
  .pinfo{font-size:10.5px;gap:2px 7px}
}
/* ---------- keyword（v1.3） ---------- */
.kws{position:absolute;left:2px;top:2px;display:flex;flex-direction:column;gap:2px;z-index:2;align-items:flex-start}
.kw{font-size:8.5px;font-weight:900;line-height:1;padding:2px 3px;border-radius:4px;color:#0b0e16;letter-spacing:.02em;box-shadow:0 1px 2px rgba(0,0,0,.6)}
.kw-guardian{background:#f2c14e}.kw-lethal{background:#ff6b6b;color:#fff}.kw-stealth{background:#b9a3ff}.kw-jinrai{background:#7fd8ff}
.sz-list .kw,.sz-big .kw{font-size:10px;padding:2px 4px}
.sz-big .kw{font-size:12px;padding:3px 6px}
.cf.stealthed{border-style:dashed;opacity:.78}
.cf.stealthed .cf-art{filter:saturate(.55) brightness(.85)}
.cf.stealthed .kw-stealth{animation:kwBlink 2.4s ease-in-out infinite}
@keyframes kwBlink{0%,100%{opacity:1}50%{opacity:.45}}
.noanim .cf.stealthed .kw-stealth{animation:none}
.kwdesc{font-size:12px;line-height:1.6;margin:6px 0}
.kwdesc b{margin-right:4px}
/* ---------- 進化（v1.4） ---------- */
.kw-evo{background:linear-gradient(90deg,#ffe08a,#ff9de2);color:#2a1030}
.cf.evolved{border-color:#ffd36b;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 0 0 1px #ff9de2,0 0 12px rgba(255,190,120,.55)}
.cf.evolved .cf-name::before{content:"★";color:#ffd36b;margin-right:2px}
.evo{color:var(--muted)}.evo b{color:#ffd36b;margin-left:3px;font-size:13px}
/* ---------- デッキ編集（v1.5） ---------- */
.dslot{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.dslot.sel{border-color:var(--gold)}
.dslot-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
.dslot-sub{font-size:11px;color:var(--muted);margin:3px 0 2px}
.dslot .btns{flex-wrap:wrap}.dslot .btns .btn{flex:1 1 auto;padding:9px 8px;font-size:12.5px}
.okc{color:var(--green);font-size:12px;font-weight:700}.ngc{color:var(--danger);font-size:12px;font-weight:700}
.dedit{flex:1;display:flex;flex-direction:column;min-height:0}
.dhead{display:flex;gap:10px;align-items:flex-end;padding:10px 12px 6px;background:var(--panel);border-bottom:1px solid var(--line)}
.dname{flex:1;min-width:0}.dname label{display:block;font-size:10px;color:var(--muted)}
.dname input{width:100%;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;font-weight:700}
.dcount{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}.dcount b{font-size:24px;color:var(--danger)}
.dcount.full b{color:var(--green)}.dcount small{display:block;font-size:11px}
.dfilters{padding:6px 10px;background:#0f1320;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.chips{display:flex;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chip2{flex:0 0 auto;padding:5px 10px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);font-size:12px;font-weight:700;color:var(--muted)}
.chip2.on{background:#2c6df0;border-color:#4d8dff;color:#fff}
.dbody{flex:1;overflow-y:auto;padding:8px 10px 12px}
.dsum{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-bottom:8px;font-size:12px}
.dsum summary{font-weight:700;cursor:pointer}
.dlist{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px}
.dl{font-size:11.5px;white-space:nowrap}.dl .dot{display:inline-block;width:8px;height:8px;margin-right:3px;vertical-align:middle}
.dcell{display:flex;flex-direction:column;gap:4px}
.cf.indeck{box-shadow:0 0 0 2px var(--green)}
.dcnt{position:absolute;right:4px;top:3px;background:var(--green);color:#03170b;font-weight:900;font-size:12px;border-radius:8px;padding:0 6px;z-index:3}
.dstep{display:flex;align-items:center;justify-content:space-between;gap:4px}
.dstep button{flex:1;height:30px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:17px;font-weight:900}
.dstep button:disabled{opacity:.3}.dstep span{min-width:18px;text-align:center;font-weight:900}
.dfoot{display:flex;gap:6px;padding:8px 10px;background:#0b0e17;border-top:1px solid var(--line)}
.dfoot .btn{flex:1;max-width:none;padding:11px 6px;font-size:13px}
.dwarn{font-size:11px;color:var(--danger);text-align:center;padding:0 10px 8px;background:#0b0e17}
.deckrow{display:flex;align-items:center;gap:8px}
/* ---------- card frame ---------- */
.cf{position:relative;display:flex;flex-direction:column;gap:2px;border-radius:8px;padding:3px;text-align:left;
  background:linear-gradient(170deg,color-mix(in srgb,var(--c) 36%,#1a2030),#10141f 72%);
  border:2px solid color-mix(in srgb,var(--c) 80%,#000);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 2px 6px rgba(0,0,0,.45);
  overflow:hidden;transition:transform .15s,opacity .15s;color:var(--text)}
.cf-top{display:flex;align-items:center;justify-content:space-between;gap:2px;min-height:1em}
.cf-cost{color:var(--gold);letter-spacing:-1.5px;line-height:1;white-space:nowrap;overflow:hidden}
.cf-bt{color:var(--gold);font-weight:900;letter-spacing:.05em}
.cf-pay{background:var(--gold);color:#1a1200;border-radius:6px;font-weight:900;padding:0 4px;line-height:1.35}
.cf-art{position:relative;flex:0 0 auto;border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--c) 58%,#222),#0b0e16 82%);border:1px solid rgba(0,0,0,.4)}
.cf-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fb-k{font-weight:900;color:color-mix(in srgb,var(--c) 55%,#fff);text-shadow:0 0 10px var(--c);line-height:1}
.fb-id{position:absolute;right:3px;bottom:1px;font-weight:800;color:rgba(255,255,255,.72)}
.cf-name{font-weight:800;line-height:1.15;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cf-bot{display:flex;align-items:baseline;justify-content:space-between;gap:2px;margin-top:auto}
.cf-bp{font-weight:900;letter-spacing:-.02em;line-height:1}
.cf-bp.mod{color:var(--gold)}
.cf-type{color:var(--muted)}
.cf-lv{color:var(--gold);letter-spacing:-1px;line-height:1}
.cf-orbs{position:absolute;left:2px;bottom:1px;color:var(--orb);letter-spacing:-1.5px;text-shadow:0 0 4px #000,0 0 2px #000}
.cf-tap{position:absolute;top:2px;right:2px;font-size:8.5px;font-weight:800;color:#1a1200;background:#ffb070;border-radius:4px;padding:0 3px;z-index:2}
.cf-new{position:absolute;top:19px;left:5px;font-size:8px;font-weight:900;color:#06210f;background:#5ff0a0;border-radius:4px;padding:0 3px}
/* アタックできるユニット：枠がゆるやかに光る（タップで宣言）。BPは隠さない */
@keyframes atkPulse{0%,100%{box-shadow:0 0 0 1.5px var(--gold),0 0 6px color-mix(in srgb,var(--gold) 45%,transparent)}50%{box-shadow:0 0 0 2.5px var(--gold),0 0 18px var(--gold)}}
.cf.can-atk{border-color:var(--gold);animation:atkPulse 1.6s ease-in-out infinite;cursor:pointer}
.noanim .cf.can-atk{animation:none;box-shadow:0 0 0 2px var(--gold),0 0 12px var(--gold)}
.cf.tapped{opacity:.6;transform:rotate(-8deg) scale(.92)}
.cf.atk{box-shadow:0 0 0 2px var(--gold),0 0 14px var(--gold)}
.cf.blk{box-shadow:0 0 0 2px #fff,0 0 12px #9cc4ff}
.cf.usable{border-color:var(--gold);box-shadow:0 0 10px color-mix(in srgb,var(--gold) 60%,transparent)}
.sz-unit{width:calc((100% - 20px)/5);max-width:72px;height:112px;flex:0 1 auto}
.sz-unit .cf-name{font-size:9.5px}.sz-unit .cf-art{height:54px}.sz-unit .fb-k{font-size:20px}.sz-unit .fb-id{font-size:8px}
.sz-unit .cf-bp{font-size:15px}.sz-unit .cf-lv{font-size:9px}.sz-unit .cf-orbs{font-size:9px}
.sz-hand{flex:0 0 66px;height:96px}
.sz-hand .cf-cost{font-size:8px}.sz-hand .cf-pay{font-size:9px}.sz-hand .cf-art{height:34px}.sz-hand .fb-k{font-size:16px}.sz-hand .fb-id{font-size:8px}
.sz-hand .cf-name{font-size:9.5px}.sz-hand .cf-bp{font-size:12px}.sz-hand .cf-type{font-size:8.5px}.sz-hand .cf-lv{font-size:9px}
.sz-list{height:auto;width:100%;gap:3px}
.sz-list .cf-cost{font-size:10px}.sz-list .cf-art{height:auto;aspect-ratio:1/1}.sz-list .fb-k{font-size:30px}.sz-list .fb-id{font-size:9px}
.sz-list .cf-name{font-size:11.5px}.sz-list .cf-bp{font-size:15px}.sz-list .cf-type{font-size:10px}.sz-list .cf-lv{font-size:10px}
.sz-list .cf-bot{min-height:17px;align-items:center}
.sz-big{width:160px;height:228px;margin:0 auto 10px;padding:5px;border-width:3px;border-radius:12px}
.sz-big .cf-cost{font-size:13px}.sz-big .cf-pay{font-size:12px}.sz-big .cf-art{height:126px}.sz-big .fb-k{font-size:52px}.sz-big .fb-id{font-size:11px}
.sz-big .cf-name{font-size:15px}.sz-big .cf-bp{font-size:22px}.sz-big .cf-type{font-size:12px}.sz-big .cf-lv{font-size:13px}
.ghost{pointer-events:none}

/* ---------- animation（設定でオフ可） ---------- */
@keyframes lungeUp{0%{transform:rotate(-8deg) scale(.92)}35%{transform:translateY(-24px) rotate(-3deg) scale(1.06)}100%{transform:rotate(-8deg) scale(.92)}}
@keyframes lungeDown{0%{transform:rotate(-8deg) scale(.92)}35%{transform:translateY(24px) rotate(-3deg) scale(1.06)}100%{transform:rotate(-8deg) scale(.92)}}
@keyframes dying{0%{transform:translateX(0);opacity:1}12%{transform:translateX(-6px)}24%{transform:translateX(6px);filter:brightness(1.9) saturate(.4)}36%{transform:translateX(-5px)}48%{transform:translateX(4px)}100%{transform:scale(.82);opacity:0;filter:brightness(1.4) saturate(.2)}}
@keyframes bounceOut{0%{opacity:1}100%{transform:translateY(-28px) scale(.8);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.a-lunge-up{animation:lungeUp .42s ease-out both}
.a-lunge-down{animation:lungeDown .42s ease-out both}
.a-dying{animation:dying .46s ease-in both}
.a-bounce{animation:bounceOut .38s ease-in both}
.a-shake{animation:shake .42s ease-out both;display:inline-flex}
.a-shake .lo{box-shadow:0 0 6px #ff6b6b}

/* ---------- step banner / CPU toast ---------- */
.stepov{position:absolute;inset:0;z-index:25;background:rgba(3,5,10,.62);display:flex;align-items:center;justify-content:center;padding:20px}
.steppanel{width:100%;max-width:330px;background:linear-gradient(180deg,#1a2238,#121828);border:1px solid #3a4870;border-radius:16px;padding:18px 16px 14px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.steppanel .who{font-size:11px;color:var(--muted)}
.steppanel .stt{font-size:22px;font-weight:900;margin:4px 0 6px;letter-spacing:.06em}
.steppanel .stb{font-size:14px;line-height:1.6;color:#d3d9e8}
.steppanel .stb b{color:var(--orb)}
.steppanel .cards{display:flex;gap:8px;justify-content:center;margin:12px 0 4px}
.steppanel .sdots{display:flex;gap:6px;justify-content:center;margin:12px 0 6px}
.steppanel .sdots i{width:7px;height:7px;border-radius:50%;background:#33405f}.steppanel .sdots i.on{background:var(--gold)}
.steppanel .tap{font-size:12px;color:var(--gold);font-weight:700}
.cputoast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:15;pointer-events:none;background:rgba(18,24,40,.94);
  border:1px solid #3a4870;padding:10px 16px;border-radius:12px;font-weight:800;font-size:14px;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.cputoast small{display:block;font-weight:400;color:var(--muted);font-size:11px;text-align:center}

/* ---------- tutorial ---------- */
.tut{flex:1;display:flex;flex-direction:column;padding:16px 18px 18px;min-height:0}
.tut-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.tut-skip{padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-size:12px;font-weight:700;color:var(--text)}
.tut-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;overflow-y:auto;padding:10px 2px}
.tut-tag{font-size:11px;color:var(--gold);font-weight:800;letter-spacing:.2em}
.tut-title{font-size:24px;font-weight:900;line-height:1.35}
.tut-text{font-size:15px;line-height:1.8;color:#d3d9e8}
.tut-list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.tut-list li{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;line-height:1.55}
.tut-list li b{color:var(--c,var(--text))}
.tut-dots{display:flex;gap:6px;justify-content:center;margin:8px 0 12px}
.tut-dots i{width:8px;height:8px;border-radius:50%;background:#33405f}.tut-dots i.on{background:var(--gold)}
.tut-nav{display:flex;gap:10px}.tut-nav .btn{max-width:none}

/* ---------- modal ---------- */
.ov{position:absolute;inset:0;background:rgba(3,5,10,.55);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;max-height:72%;overflow-y:auto;background:var(--panel);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.sheet.full{max-height:92%}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet .note{color:var(--muted);font-size:12px;margin:0 0 10px;line-height:1.5}
.row{display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);margin-bottom:6px;width:100%;text-align:left}
.row.ok{border-color:var(--gold);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 40%,transparent)}
.row.ng{opacity:.6;padding:6px 10px;margin-bottom:4px}
.row.ng .nm{font-size:12px}
.row .nm{flex:1;font-weight:700;font-size:14px}
.row .nm small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:2px}
.row .rs{font-size:11px;color:var(--danger);text-align:right;max-width:46%}
.row .tag{font-size:12px;font-weight:800;color:var(--gold);white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:0 0 10px}
.pass{display:block;width:100%;padding:16px;border-radius:12px;background:linear-gradient(180deg,#3a4566,#283150);
  font-size:18px;font-weight:900;margin-top:10px;border:1px solid #4b5a85}
.vs{display:flex;gap:8px;margin:8px 0 12px}
.vs>div{flex:1;background:var(--panel2);border-radius:10px;padding:8px;border:1px solid var(--line);font-size:12px}
.vs b{display:block;font-size:13px}.vs .big{font-size:20px;font-weight:900}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:8px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.eff{background:var(--panel2);border-radius:10px;padding:10px;font-size:13px;line-height:1.6;margin:8px 0}
.eff .stage{color:var(--muted);font-size:11px}
.btns{display:flex;gap:8px;margin-top:10px}.btns>*{flex:1}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:18px;font-weight:800}
.stepper span{min-width:18px;text-align:center;font-weight:800}
.warn{color:var(--danger);font-size:11px}
.logfull{font-size:12px;line-height:1.55;color:#c9cfdd;font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all}

/* ---------- pages ---------- */
.page{flex:1;overflow-y:auto;padding:16px 14px 24px}
.page h2{margin:4px 0 12px;font-size:20px}
.page h4{margin:16px 0 8px;font-size:14px;color:var(--c)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.toggle{display:inline-block;min-width:44px;text-align:center;border-radius:12px;padding:2px 8px;font-size:12px;font-weight:800;background:#33405f}
.toggle.on{background:var(--green);color:#03170b}
.res{text-align:center;padding:30px 16px;flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;align-items:center}
.res .big{font-size:48px;font-weight:900;letter-spacing:.1em}
.res .big.win{color:var(--gold)}.res .big.lose{color:#7d89a8}
.card{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;max-width:340px}
.simf label{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.simf input[type=number]{width:110px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px}
.simf select{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:13px}
.simf input[type=checkbox]{width:22px;height:22px}
.metric{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.metric b{font-size:15px}
.metric.hl b{font-size:20px;color:var(--gold)}
.errl{font-size:11px;color:var(--danger);font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap;margin-top:8px}
.prov{font-size:10px;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:0 4px;margin-left:4px}
</style>
</head>

<script id="engine">
(function(root){
'use strict';
const DEFS = root.CARDS_SOURCE || JSON.parse(document.getElementById('cards-json').textContent);
const DEF = {}; DEFS.forEach(d => { DEF[d.id] = d; });

// ---------- デッキ（拡張Stage 3／正本v1.5） ----------
// 初期プリセット4種（各36枚）。「標準」が既定のデッキ（旧・初期デッキを置き換え）
const PRESETS = [
  {key: 'std', name: '標準', cards: {R1: 3, R2: 2, R3: 1, R4: 1, R5: 2, R6: 1, B1: 3, B2: 1, B3: 2, B4: 1, B5: 1, B6: 1,
    G1: 2, G2: 1, G3: 1, G4: 1, G5: 1, M1: 1, M2: 1, M4: 1, M5: 1, M6: 1, M8: 1, N1: 1, X1: 1, X2: 2, X3: 1}},
  {key: 'red', name: '紅軸', cards: {R1: 3, R2: 2, R3: 3, R4: 2, R5: 1, R6: 2, R7: 1, R8: 2, M1: 2, M7: 1, N1: 3, X1: 3, M4: 3, G1: 3, M3: 2, G8: 1, B2: 2}},
  {key: 'blue', name: '蒼軸', cards: {B1: 3, B2: 3, B3: 3, B4: 2, B5: 2, B6: 3, B7: 3, B8: 1, B9: 1, M2: 3, M3: 1, M4: 2, M6: 1, M8: 2, M10: 1, N2: 3, X2: 2}},
  {key: 'green', name: '翠軸', cards: {G1: 3, G2: 3, G3: 2, G4: 3, G5: 3, G6: 3, G7: 2, G8: 2, M3: 3, M6: 3, M9: 3, X3: 3, M4: 3}}
];
const DECK_SIZE = 36, SAME_MAX = 3;
const DECK_LIST = Object.entries(PRESETS[0].cards);   // 既定（標準）
const deckCount = cards => Object.values(cards || {}).reduce((s, n) => s + n, 0);
// デッキの検証：36枚ちょうど・同名3枚まで・存在するカードID（属性の制限なし。バーストも通常の枚数に数える）
function validateDeck(cards){
  const errs = [];
  if(!cards || typeof cards !== 'object' || Array.isArray(cards)) return {ok: false, errors: ['デッキの形式が不正'], count: 0};
  for(const [id, n] of Object.entries(cards)){
    if(!DEF[id]) errs.push(`存在しないカードID：${id}`);
    if(!Number.isInteger(n) || n < 0) errs.push(`${id} の枚数が不正`);
    else if(n > SAME_MAX) errs.push(`${DEF[id] ? DEF[id].name : id} が${SAME_MAX}枚を超えている（${n}枚）`);
  }
  const count = Object.values(cards).reduce((s, n) => s + (Number.isInteger(n) && n > 0 ? n : 0), 0);
  if(count !== DECK_SIZE) errs.push(`${DECK_SIZE}枚ちょうどではない（${count}枚）`);
  return {ok: !errs.length, errors: errs, count};
}
const cleanCards = cards => Object.fromEntries(Object.entries(cards).filter(([, n]) => n > 0));
const presetSlot = i => ({name: PRESETS[i].name, cards: Object.assign({}, PRESETS[i].cards)});
function defaultDeckStore(){ return {v: 1, selected: 0, slots: PRESETS.map((_, i) => presetSlot(i))}; }
// 保存データの読み込み・修復：壊れているスロットだけ、そのスロットの初期プリセットに戻す（他のスロットはそのまま）
function normalizeDeckStore(raw){
  const repaired = [];
  let o = raw;
  if(typeof raw === 'string'){ try{ o = JSON.parse(raw); }catch(e){ o = null; } }
  if(!o || typeof o !== 'object' || o.v !== 1 || !Array.isArray(o.slots)) return {store: defaultDeckStore(), repaired: raw == null ? [] : [0, 1, 2, 3], wholeReset: raw != null};
  const slots = [];
  for(let i = 0; i < PRESETS.length; i++){
    const s = o.slots[i];
    const ok = s && typeof s === 'object' && typeof s.name === 'string' && s.name.trim() && validateDeck(s.cards).ok;
    if(ok) slots.push({name: s.name.slice(0, 16), cards: cleanCards(s.cards)});
    else { slots.push(presetSlot(i)); repaired.push(i); }
  }
  const sel = Number.isInteger(o.selected) && o.selected >= 0 && o.selected < PRESETS.length ? o.selected : 0;
  return {store: {v: 1, selected: sel, slots}, repaired, wholeReset: false};
}

// 仕様に書かれていない箇所の「仮置き」。ここ以外で勝手に決めない。番号は納品時の未決定事項一覧と対応。
const SETTINGS = {
  reductionCap: true,            // 決定1：軽減の上限＝カードの reduction 値（正式。false は検証用）
  attackBpUpDuration: 'battle',  // 決定7：attack_bp_up は「このバトル中」（正式）
  turnCap: 200,                  // [未決定#9] 自動対戦の安全装置（到達＝エラー終了）
  flashActionCap: 20             // 5-1 の安全装置（仕様どおり）
};
// 進化（拡張Stage 2／正本v1.4 4-9）：無料・各プレイヤー試合中2回・1ターン1回・自分の2ターン目から・1体1回・BP+2000
const EVOLVE = {maxUses: 2, bpBonus: 2000, fromOwnTurn: 2};
const CJ = {red:'紅',blue:'蒼',green:'翠',none:'無'};
const TYPEJ = {unit:'ユニット',magic:'マジック',area:'領域',burst:'バースト',burst_unit:'バースト・ユニット'};

class GameOver extends Error { constructor(winner, reason){ super('GameOver'); this.winner = winner; this.reason = reason; } }
class RuleError extends Error {}
class FatalError extends Error {}

function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(g, arr){ for(let i = arr.length - 1; i > 0; i--){ const j = Math.floor(g.rng() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } }

const isUnitDef = d => d.type === 'unit' || d.type === 'burst_unit';
const opp = (g, p) => g.players[1 - p.idx];
function mkCard(g, id){ return {uid: g.uid++, id, def: DEF[id]}; }
function makeUnit(g, card, p){ return {uid: g.uid++, id: card.id, def: card.def, owner: p.idx, orbs: 0, tapped: false, mods: [], enteredTurn: g.turn,
  stealth: card.def.keywords.includes('stealth')}; }   // 潜伏は場の個体ごとの状態（v1.3）
const hasKw = (u, k) => !!u && u.def.keywords.includes(k);
// 機能している守護：守護を持ち、潜伏していない（疲労していても有効）
const activeGuardians = p => p.field.filter(u => hasKw(u, 'guardian') && !u.stealth);

function log(g, m){ g.log.push({t: g.turn, m}); if(g.log.length > g.logLimit) g.log.splice(0, g.log.length - g.logLimit); }
function err(g, m){ g.errors.push(`T${g.turn}: ${m}`); log(g, '【エラー】' + m); }
function upd(g){ if(g.onUpdate) g.onUpdate(g); }

// ---------- レベル／BP（4-4） ----------
function level(u){ let lv = 0; for(const L of u.def.levels) if(u.orbs >= L.cores) lv = L.lv; return lv; }
function levelAt(def, orbs){ let lv = 0; for(const L of def.levels) if(orbs >= L.cores) lv = L.lv; return lv; }
function bpAtLevel(def, lv){ const L = def.levels.find(x => x.lv === lv); return L ? L.bp : 0; }
function levelCores(def, lv){ const L = def.levels.find(x => x.lv === lv); return L ? L.cores : 0; }
const surplus = u => u.orbs - levelCores(u.def, level(u));     // レベルに寄与していないオーブ
function baseBp(u){ const lv = level(u); const L = u.def.levels.find(x => x.lv === lv); return L ? L.bp : 0; }
function bp(g, u){
  let v = baseBp(u);
  const owner = g.players[u.owner];
  const a = owner.area && owner.area.def.effect;
  if(a && a.kind === 'field_bp_up' && a.targetColor === u.def.color) v += a.value;
  for(const m of u.mods) v += m.value;
  if(u.evolved) v += EVOLVE.bpBonus;   // 進化（v1.4）：試合中ずっと有効、他のBP増減と合算
  return Math.max(0, v);   // v1.3：0未満にはならない
}
function findUnit(g, uid){ for(const p of g.players){ const u = p.field.find(x => x.uid === uid); if(u) return u; } return null; }

// ---------- 支払い（4-2） ----------
function symbols(p, color){
  let s = 0;
  for(const u of p.field) if(u.def.color === color) s += (u.def.symbol || 0);   // 疲労していても数える
  if(p.area && p.area.def.color === color) s += (p.area.def.symbol || 0);
  return s;
}
function reductionOf(p, def){
  let r = 0;
  for(const [color, cap] of Object.entries(def.reduction || {})){
    const s = symbols(p, color);
    r += SETTINGS.reductionCap ? Math.min(s, cap) : s;
  }
  return r;
}
function paymentFor(p, def){ return Math.max(1, def.cost - reductionOf(p, def)); }   // 最低1
const unitOrbs = p => p.field.reduce((s, u) => s + u.orbs, 0);
const surplusOrbs = p => p.field.reduce((s, u) => s + Math.max(0, surplus(u)), 0);

function doPay(g, p, amount, payFrom){
  const fromStock = Math.min(p.stock, amount);
  const rest = amount - fromStock;
  const plan = [];
  if(rest > 0){
    if(!payFrom) throw new RuleError('ストック不足（ユニットからの支払い指定なし）');
    let sum = 0;
    for(const [k, n0] of Object.entries(payFrom)){
      const n = n0 | 0; if(!n) continue;
      const u = p.field.find(x => String(x.uid) === String(k));
      if(!u || n < 0 || n > u.orbs) throw new RuleError('ユニットからの支払い指定が不正');
      sum += n; plan.push([u, n]);
    }
    if(sum !== rest) throw new RuleError(`ユニットからの支払い数が不一致（必要${rest}／指定${sum}）`);
  }
  p.stock -= fromStock;
  for(const [u, n] of plan) u.orbs -= n;
  return {fromStock, plan};
}
// 自壊（効果による破壊ではない）
function selfDestructCheck(g){
  for(const p of g.players) for(const u of [...p.field]) if(u.orbs <= 0) leaveField(g, u, 'trash', 'self');
}
// 場を離れる：上のオーブは持ち主のストックへ（4-4）
function leaveField(g, u, dest, cause){
  const p = g.players[u.owner];
  const i = p.field.indexOf(u); if(i < 0) return false;
  p.field.splice(i, 1);
  u.leftAs = cause + ':' + dest;                                   // 表示（演出）用の記録のみ
  const back = u.orbs; p.stock += back; u.orbs = 0; u.mods = [];
  const c = mkCard(g, u.id);
  const ret = dest === 'trash' && (cause === 'battle' || cause === 'effect') && u.def.effect && u.def.effect.kind === 'return_on_destroy';
  if(dest === 'hand' || ret) p.hand.push(c); else p.trash.push(c);
  if(ret) g.stats.phoenix = (g.stats.phoenix || 0) + 1;
  if(g.battle){
    if(g.battle.attacker === u.uid) g.battle.attackerGone = true;
    if(g.battle.blocker === u.uid) g.battle.blockerGone = true;
  }
  const why = {self:'自壊', battle:'バトルで破壊', effect: dest === 'hand' ? '手札に戻る' : '効果で破壊'}[cause] || cause;
  log(g, `${p.name}の${u.def.name}：${why}${back ? `（オーブ${back}→ストック）` : ''}${ret ? '→ 効果で手札に戻る' : ''}`);
  return true;
}

function drawN(g, p, n){
  for(let i = 0; i < n; i++){
    if(!p.deck.length){ log(g, `${p.name}はドローできない → 敗北`); throw new GameOver(1 - p.idx, 'deckout'); }
    p.hand.push(p.deck.pop());
  }
}
// ボイド（ゲーム外）からストックへ追加。ゲーム内のオーブ総量が増える（7章 core_add）
function coreAdd(g, p, v){ p.stock += v; p.orbTotal += v; g.stats.voidAdded += v; log(g, `${p.name}：ボイドから${v}個をストックへ追加`); }

function targetCandidates(g, p, eff){
  const t = eff && eff.target; if(!t) return null;
  const side = t.owner === 'opponent' ? opp(g, p) : p;
  return side.field.filter(u => !(t.owner === 'opponent' && u.stealth) &&
    (t.maxCost == null || u.def.cost <= t.maxCost) &&
    (t.maxBp == null || bp(g, u) <= t.maxBp) &&
    (t.state !== 'untapped' || !u.tapped) &&
    (t.state !== 'tapped' || u.tapped));
}
const maxTargetsOf = eff => (eff && eff.target && eff.target.maxTargets) || 1;
// 対象指定を配列にそろえる（1体なら数値、複数なら配列のどちらでも受け付ける）
const targetList = tg => tg == null ? [] : (Array.isArray(tg) ? tg : [tg]);

// 使用可否（フラッシュ：対応マジック／迅雷ユニット。バースト＝F3）
// opts.allowUnits：true（既定）＝ユニット上の全オーブ／'surplus'＝レベルを下げない余剰分のみ（CPU）／false＝ストックのみ
function checkPlay(g, p, card, timing, target, opts){
  const pool = (!opts || opts.allowUnits === undefined || opts.allowUnits === true) ? 'all' : (opts.allowUnits === false ? 'none' : opts.allowUnits);
  const allowUnits = pool !== 'none';
  const unitPool = pool === 'all' ? unitOrbs(p) : pool === 'surplus' ? surplusOrbs(p) : 0;
  const d = card.def;
  const no = reason => ({ok: false, reason});
  if(d.type === 'burst') return no('バースト専用（セットのみ）');
  const jinraiFlash = timing === 'flash' && isUnitDef(d) && d.keywords.includes('jinrai');
  if(!d.useTiming.includes(timing) && !jinraiFlash)
    return no(timing === 'flash' ? (isUnitDef(d) ? '迅雷なし（フラッシュ召喚不可）' : 'フラッシュでは使えない') : 'メインでは使えない');
  if(timing === 'flash' && !g.battle) return no('フラッシュ窓の外');
  if(isUnitDef(d) && p.field.length >= 5) return no('場が満杯（5体）');
  const pay = paymentFor(p, d);
  const avail = p.stock + unitPool;
  if(avail < pay) return no(`オーブ不足（支払い${pay}／ストック${p.stock}${unitPool ? '＋ユニット上' + unitPool : ''}）`);
  let cands = null;
  if(d.type === 'magic' && d.effect && d.effect.target){
    cands = targetCandidates(g, p, d.effect);
    if(!cands.length) return no('対象なし');
    if(target != null){
      const ts = targetList(target), mx = maxTargetsOf(d.effect);
      if(!ts.length || ts.length > mx || new Set(ts).size !== ts.length || !ts.every(x => cands.some(u => u.uid === x))) return no('不正な対象');
    }
  }
  return {ok: true, pay, needUnits: p.stock < pay, cands};
}

function applyEffect(g, p, e, t){
  switch(e.kind){
    case 'draw': drawN(g, p, e.value); log(g, `${p.name}：${e.value}枚引く`); break;
    case 'core_add': coreAdd(g, p, e.value); break;
    case 'destroy': if(t.owner !== p.idx) g.pendingB.add(t.owner); leaveField(g, t, 'trash', 'effect'); break;
    case 'bounce': if(t.owner !== p.idx) g.pendingB.add(t.owner); leaveField(g, t, 'hand', 'effect'); break;
    case 'exhaust': t.tapped = true; log(g, `${g.players[t.owner].name}の${t.def.name}：疲労`); break;
    case 'bp_up': t.mods.push({value: e.value, until: e.duration === 'turn' ? 'turn' : 'battle'});
      log(g, `${t.def.name}：BP+${e.value}（${e.duration === 'turn' ? 'このターン' : 'このバトル'}）→ ${bp(g, t)}`); break;
    case 'bp_down': t.mods.push({value: -e.value, until: e.duration === 'turn' ? 'turn' : 'battle'});
      log(g, `${t.def.name}：BP−${e.value}（${e.duration === 'turn' ? 'このターン' : 'このバトル'}）→ ${bp(g, t)}`); break;
    default: throw new FatalError('未対応の効果kind: ' + e.kind);
  }
}

// ---------- 自動パス（10章） ----------
function hasFlashAction(g, p){
  if(p.hand.some(c => checkPlay(g, p, c, 'flash', null).ok)) return true;
  return p.field.some(u => u.def.flashEffect && checkFx(g, p, u).ok);
}
// 「負けに直結する場面」[新F3#7]：防御側でライフ1、かつこのままだとライフに通る（W1：ブロックできるユニットなし／W2：ブロッカーなし・離脱）
function lethalSpot(g, p){
  const b = g.battle; if(!b || p.idx === b.atkOwner || p.life > 1) return false;
  if(b.window === 'W1') return !p.field.some(x => !x.tapped && x.noBlockBattle !== b.id);
  if(b.window === 'W2') return !b.blocker || b.blockerGone;
  return false;
}
function shouldAskFlash(g, p, mode){
  if(mode === 1) return true;
  if(!hasFlashAction(g, p)) return false;
  if(mode === 3) return lethalSpot(g, p);
  return true;
}

async function ask(g, p, method, ...args){
  const a = g.agents[p.idx];
  if(a.isCPU && g.delay) await g.delay(method);
  return await a[method](g, p, ...args);
}

// カードを使う（召喚／マジック／領域）。4-2 の順序：確認→支払い→行き先→再計算→効果
async function applyPlay(g, p, act, timing){
  const card = p.hand.find(c => c.uid === act.uid);
  if(!card) throw new RuleError('手札にないカード');
  const chk = checkPlay(g, p, card, timing, act.target);
  if(!chk.ok) throw new RuleError(chk.reason);
  if(chk.cands && !targetList(act.target).length) throw new RuleError('対象が未指定');
  const d = card.def, amount = chk.pay;
  const paid = doPay(g, p, amount, act.payFrom);                     // 2. 支払い
  p.hand.splice(p.hand.indexOf(card), 1);
  g.stats.plays[d.id] = (g.stats.plays[d.id] || 0) + 1;
  if(timing === 'flash') g.stats.flashPlays[d.id] = (g.stats.flashPlays[d.id] || 0) + 1;
  const payTxt = `支払い${amount}${paid.plan.length ? `（ユニット上から${amount - paid.fromStock}）` : ''}`;
  if(isUnitDef(d)){
    const u = makeUnit(g, card, p);
    u.orbs = 1; p.recovery += amount - 1; p.field.push(u);          // 3. Lv1維持分1個をユニットへ、残りは回収待ち
    if(timing === 'flash' && g.battle){
      u.flashBattle = g.battle.id;                                   // そのバトルではアタック不可（アタックは宣言済みのため実質影響なし）
      if(g.battle.window === 'W2') u.noBlockBattle = g.battle.id;   // W2で出したユニットはそのバトルでブロック不可
      g.stats.flashSummons++;
    }
    log(g, `${p.name}：${d.name}を${timing === 'flash' ? '迅雷でフラッシュ召喚' : '召喚'}（${payTxt}）`);
    selfDestructCheck(g); checkInv(g); upd(g);                       // 4. 再計算（BPは都度計算）／自壊
    const e = d.effect;                                              // 5. 召喚時効果
    if(e && e.timing === 'on_summon'){
      if(e.target){
        const c = targetCandidates(g, p, e);
        if(!c.length) log(g, `${d.name}の召喚時効果：対象なし`);
        else {
          const r = await ask(g, p, 'chooseTarget', d, c);
          let t = c.find(x => x.uid === r);
          if(!t){ err(g, `${p.name} 召喚時効果の対象が不正 → 候補の先頭を使用`); t = c[0]; }
          applyEffect(g, p, e, t);
        }
      } else applyEffect(g, p, e, null);
      await flushBurstB(g);
    }
  } else if(d.type === 'magic'){
    p.recovery += amount; p.trash.push(card);
    log(g, `${p.name}：${d.name}を使用${timing === 'flash' ? '（フラッシュ）' : ''}（${payTxt}）`);
    selfDestructCheck(g);
    if(chk.cands){
      const ts = targetList(act.target).map(x => findUnit(g, x)).filter(Boolean);   // 離れた個体への効果は終了
      if(!ts.length){ log(g, `${d.name}：対象が場を離れたため効果なし`); checkInv(g); upd(g); return; }
      for(const u of ts) if(findUnit(g, u.uid)) applyEffect(g, p, d.effect, u);
    } else applyEffect(g, p, d.effect, null);
    await flushBurstB(g);
  } else if(d.type === 'area'){
    p.recovery += amount;
    if(p.area){ p.trash.push(p.area); log(g, `${p.name}：${p.area.def.name}を捨て札へ`); }
    p.area = card;
    log(g, `${p.name}：領域「${d.name}」を設置（${payTxt}）`);
    selfDestructCheck(g);
  }
  checkInv(g); upd(g);
}

// ---------- 場のフラッシュ効果（5-2 の行動F3：1バトル1回） ----------
function checkFx(g, p, u){
  const f = u.def.flashEffect, no = reason => ({ok: false, reason});
  if(!f) return no('フラッシュ効果なし');
  if(!g.battle) return no('フラッシュ窓の外');
  if(u.owner !== p.idx || !p.field.includes(u)) return no('自分の場のユニットではない');
  if(f.oncePerBattle && u.fxBattle === g.battle.id) return no('このバトルでは使用済み');
  if(f.oncePerTurn && u.fxTurn === g.turn) return no('このターンでは使用済み');
  if(f.kind === 'discard_draw' && p.hand.length < (f.discard || 1)) return no('捨てる手札がない');
  if(f.target && !targetCandidates(g, p, f).length) return no('対象なし');
  return {ok: true, cands: f.target ? targetCandidates(g, p, f) : null};
}
function applyFx(g, p, act){
  const u = p.field.find(x => x.uid === act.uid);
  if(!u) throw new RuleError('場にないユニット');
  const k = checkFx(g, p, u); if(!k.ok) throw new RuleError(k.reason);
  const f = u.def.flashEffect;
  if(f.kind === 'discard_draw'){
    const c = p.hand.find(x => x.uid === act.discard);
    if(!c) throw new RuleError('捨てるカードの指定が不正');
    u.fxBattle = g.battle.id; u.fxTurn = g.turn;
    p.hand.splice(p.hand.indexOf(c), 1); p.trash.push(c);
    log(g, `${p.name}：${u.def.name}のフラッシュ効果 → ${c.def.name}を捨てる`);
    drawN(g, p, f.value); log(g, `${p.name}：${f.value}枚引く`);
  } else if(f.kind === 'self_core_add'){
    u.fxBattle = g.battle.id; u.fxTurn = g.turn;
    const n = f.value;
    u.orbs += n; p.orbTotal += n; g.stats.voidAdded += n;
    log(g, `${p.name}：${u.def.name}のフラッシュ効果 → ボイドから${n}個をこのユニットへ（Lv${level(u)}・BP${bp(g, u)}）`);
  } else if(f.kind === 'bp_up' || f.kind === 'bp_down'){
    const tg = k.cands.find(x => x.uid === act.target);
    if(!tg) throw new RuleError('フラッシュ効果の対象が不正');
    u.fxBattle = g.battle.id; u.fxTurn = g.turn;
    log(g, `${p.name}：${u.def.name}のフラッシュ効果`);
    applyEffect(g, p, f, tg);
  } else throw new FatalError('未対応のフラッシュ効果: ' + f.kind);
  g.stats.fx[u.id] = (g.stats.fx[u.id] || 0) + 1;
  checkInv(g); upd(g);
}
// ---------- オーブ移動（4-3：メインステップのみ） ----------
// act.dist = {ユニットuid: 移動後のオーブ数}。差分はストックとやり取りする（ユニット同士の移動も含む）
function applyMove(g, p, act){
  if(g.phase !== 'main' || g.active !== p.idx || g.battle) throw new RuleError('オーブ移動は自分のメインステップのみ');
  const ch = [];
  for(const [k, v] of Object.entries(act.dist || {})){
    const u = p.field.find(x => String(x.uid) === String(k));
    if(!u || !Number.isInteger(v) || v < 0) throw new RuleError('移動の指定が不正');
    ch.push([u, v]);
  }
  const delta = ch.reduce((s, [u, v]) => s + v - u.orbs, 0);
  if(delta > p.stock) throw new RuleError('ストック不足');
  const txt = [];
  for(const [u, v] of ch) if(u.orbs !== v){ txt.push(`${u.def.name} ${u.orbs}→${v}`); u.orbs = v; }
  p.stock -= delta;
  if(!txt.length) return;
  g.stats.moves++;
  log(g, `${p.name}：オーブ移動（${txt.join('、')}／ストック${p.stock}）`);
  selfDestructCheck(g); checkInv(g); upd(g);
}

// ---------- バースト（6章） ----------
const BURST_COND = {life_lost: 'A', own_unit_removed_by_opponent: 'B'};
function checkSet(g, p, card){
  const no = reason => ({ok: false, reason});
  if(!card.def.burst) return no('バースト条件を持たないカードはセットできない');
  if(g.phase !== 'main' || g.active !== p.idx || g.battle) return no('セットは自分のメインステップのみ');
  if(p.burst) return no('バーストはセット済み（場に1枚まで）');
  return {ok: true};
}
function applySet(g, p, act){
  const c = p.hand.find(x => x.uid === act.uid);
  if(!c) throw new RuleError('手札にないカード');
  const k = checkSet(g, p, c); if(!k.ok) throw new RuleError(k.reason);
  p.hand.splice(p.hand.indexOf(c), 1); p.burst = c;
  g.stats.burstSets++;
  log(g, `${p.name}：バーストを裏向きでセット`);
  checkInv(g); upd(g);
}
// 発動できるか（対象を取る効果は有効な対象が必要）[新F3#3]
function burstUsable(g, p, def){
  const e = def.burst.effect;
  if(e.target) return targetCandidates(g, p, e).length > 0;
  return true;
}
async function tryBurst(g, p, cond){
  const c = p.burst;
  if(!c || c.def.burst.condition !== cond) return;
  g.stats.burstChances++;
  if(!burstUsable(g, p, c.def)){ g.stats.burstNoTarget++; return; }
  const yes = await ask(g, p, 'burst', c.def, BURST_COND[cond]);
  if(!yes){ g.stats.burstDeclined++; log(g, `${p.name}：バーストを発動しない（セットしたまま）`); return; }
  p.burst = null; g.stats.burstFired++; g.stats.burstFiredBy[c.id] = (g.stats.burstFiredBy[c.id] || 0) + 1;
  g.burstDepth++;
  log(g, `${p.name}：バースト「${c.def.name}」を発動（条件${BURST_COND[cond]}）`);
  let placed = false;
  try{
    const e = c.def.burst.effect;
    let t = null;
    if(e.target){
      const cands = targetCandidates(g, p, e);
      const r = await ask(g, p, 'chooseTarget', c.def, cands);
      t = cands.find(x => x.uid === r);
      if(!t){ err(g, `${p.name} バーストの対象が不正 → 候補の先頭を使用`); t = cands[0]; }
    }
    applyEffect(g, p, e, t);
    const as = c.def.burst.afterSummon;
    if(as){
      const need = as.placeCoresFromStock || 1;
      const can = p.field.length < 5 && p.stock >= need;
      let doIt = false;
      if(can) doIt = !!(await ask(g, p, 'burstSummon', c.def));
      if(doIt){
        const u = makeUnit(g, c, p);
        p.stock -= need; u.orbs = need; p.field.push(u);
        if(g.battle){ u.flashBattle = g.battle.id; if(g.battle.window !== 'W1') u.noBlockBattle = g.battle.id; }   // [新F3#6]
        g.stats.x3Summons++;
        log(g, `${p.name}：${c.def.name}を無料で召喚（ストックからオーブ1）`);
      } else {
        p.hand.push(c);
        log(g, `${p.name}：${c.def.name}は召喚せず手札へ${p.field.length >= 5 ? '（場が満杯）' : (p.stock < need ? '（ストック0）' : '')}`);
      }
    } else p.trash.push(c);
    placed = true;
  } finally {
    if(!placed && !p.hand.includes(c) && !p.trash.includes(c)) p.trash.push(c);
    g.burstDepth--;
  }
  checkInv(g); upd(g);
  await flushBurstB(g);   // バーストの効果で相手ユニットが離れた場合の条件B [新F3#4]
}
async function flushBurstB(g){
  while(g.pendingB.size){
    const idx = g.pendingB.values().next().value; g.pendingB.delete(idx);
    await tryBurst(g, g.players[idx], 'own_unit_removed_by_opponent');
  }
}

// ---------- 進化（v1.4） ----------
function checkEvolve(g, p, u){
  const no = reason => ({ok: false, reason});
  if(g.phase !== 'main' || g.active !== p.idx || g.battle) return no('進化は自分のメインステップのみ');
  if(p.turnsTaken < EVOLVE.fromOwnTurn) return no(`進化は自分の${EVOLVE.fromOwnTurn}ターン目から`);
  if(p.evoUsed >= EVOLVE.maxUses) return no(`進化は試合中${EVOLVE.maxUses}回まで（使い切った）`);
  if(p.evoTurn === g.turn) return no('進化は1ターンに1回まで');
  if(!u || u.owner !== p.idx || !p.field.includes(u)) return no('自分の場のユニットではない');
  if(u.evolved) return no('このユニットは進化済み');
  return {ok: true};
}
const canEvolveAny = (g, p) => p.field.some(u => checkEvolve(g, p, u).ok);
function applyEvolve(g, p, act){
  const u = p.field.find(x => x.uid === act.uid);
  const k = checkEvolve(g, p, u); if(!k.ok) throw new RuleError(k.reason);
  u.evolved = true; p.evoUsed++; p.evoTurn = g.turn;   // 疲労・オーブ・キーワードはそのまま
  g.stats.evolves = (g.stats.evolves || 0) + 1;
  log(g, `${p.name}：${u.def.name}を進化（BP+${EVOLVE.bpBonus} → ${bp(g, u)}／残り${EVOLVE.maxUses - p.evoUsed}回）`);
  checkInv(g); upd(g);
}

function clearMods(g, until){ for(const p of g.players) for(const u of p.field) u.mods = u.mods.filter(m => m.until !== until); }

// ---------- フラッシュ窓（5-1）：優先権は防御側から ----------
async function flashWindow(g){
  const b = g.battle;
  let pr = 1 - b.atkOwner, passes = 0, actions = 0;
  log(g, `フラッシュ${b.window}（優先権：${g.players[pr].name}から）`);
  while(true){
    if(b.attackerGone) break;
    const pl = g.players[pr];
    b.priority = pr; upd(g);
    const act = await ask(g, pl, 'flash', b.window);
    if(act && (act.type === 'play' || act.type === 'fx')){
      try{
        if(act.type === 'play') await applyPlay(g, pl, act, 'flash'); else applyFx(g, pl, act);
        g.stats.flashActions++; actions++; passes = 0;
      }catch(e){
        if(!(e instanceof RuleError)) throw e;
        err(g, `${pl.name} 不正なフラッシュ行動：${e.message}（パス扱い）`); passes++;
      }
    } else { passes++; log(g, `${pl.name}：パス${act && act.auto ? '（自動）' : ''}`); }
    if(passes >= 2) break;
    if(actions >= SETTINGS.flashActionCap){
      err(g, `フラッシュ${b.window}が${SETTINGS.flashActionCap}行動に到達したため窓を閉じた`); g.stats.capHits++; break;
    }
    pr = 1 - pr;
  }
  b.priority = null;
}

// ---------- アタック（4-6） ----------
async function doAttack(g, p, u, targetUid){
  const d = opp(g, p);
  // 守護（v1.3）：相手に機能している守護がいれば、ライフへはアタックできず、守護1体をバトルの相手にする
  const guards = activeGuardians(d);
  let guard = null;
  if(guards.length){
    guard = guards.find(x => x.uid === targetUid) || null;
    if(!guard){ if(guards.length > 1 || targetUid != null) err(g, `${p.name} 守護の指定が不正 → 先頭の守護を相手にする`); guard = guards[0]; }
  }
  u.tapped = true;
  if(u.stealth){ u.stealth = false; log(g, `${u.def.name}：アタックしたため潜伏が解けた`); }
  g.battleSeq = (g.battleSeq || 0) + 1;
  g.battle = {id: g.battleSeq, attacker: u.uid, atkOwner: p.idx, blocker: guard ? guard.uid : null, guard: guard ? guard.uid : null,
    attackerGone: false, blockerGone: false, window: null, priority: null};
  g.stats.attacks++;
  if(guard) g.stats.guardBattles = (g.stats.guardBattles || 0) + 1;
  log(g, `${p.name}：${u.def.name}でアタック${guard ? `（守護：${guard.def.name}とバトル）` : ''}`);
  try{
    const e = u.def.effect;
    if(e && e.kind === 'attack_bp_up' && e.timing === 'attack'){
      u.mods.push({value: e.value, until: SETTINGS.attackBpUpDuration});
      log(g, `${u.def.name}：アタック時 BP+${e.value} → ${bp(g, u)}`);
    }
    upd(g);
    g.battle.window = 'W1'; await flashWindow(g);
    if(g.battle.attackerGone){ g.stats.aborted++; log(g, 'アタッカーが場を離れたためアタック終了（ライフ無傷）'); return; }
    if(guard && g.battle.blockerGone){ g.stats.aborted++; log(g, '守護ユニットが場を離れたためアタック不成立（ライフ無傷）'); return; }
    let blk = guard;
    if(!guard){
    g.battle.window = 'block'; upd(g);
    const cands = d.field.filter(x => !x.tapped && x.noBlockBattle !== g.battle.id);
    if(cands.length){
      const r = await ask(g, d, 'block', u, cands);
      if(r != null){ blk = cands.find(x => x.uid === r) || null; if(!blk) err(g, `${d.name} 不正なブロッカー指定（ブロックなし扱い）`); }
    }
    if(blk){ blk.tapped = true; g.battle.blocker = blk.uid; log(g, `${d.name}：${blk.def.name}でブロック`);
      if(blk.stealth){ blk.stealth = false; log(g, `${blk.def.name}：ブロックしたため潜伏が解けた`); } }
    else log(g, cands.length ? `${d.name}：ブロックしない` : `${d.name}：ブロックできるユニットなし`);
    }
    upd(g);
    g.battle.window = 'W2'; await flashWindow(g);
    if(g.battle.attackerGone){ g.stats.aborted++; log(g, 'アタッカーが場を離れたためアタック終了（ライフ無傷）'); return; }
    if(guard && g.battle.blockerGone){ g.stats.aborted++; log(g, '守護ユニットが場を離れたためアタック不成立（ライフ無傷）'); return; }   // W2も不成立（2026-10-30決定）
    let lifeHit = false;
    if(blk && !g.battle.blockerGone){
      const a = bp(g, u), b = bp(g, blk);
      log(g, `BP比較：${u.def.name} ${a} vs ${blk.def.name} ${b}`);
      // 必殺（v1.3）：BP比較の結果によらず相手を破壊する（バトルでの破壊として扱う）
      const aLethal = hasKw(u, 'lethal'), bLethal = hasKw(blk, 'lethal');
      const blkDies = b <= a || aLethal, atkDies = a <= b || bLethal;
      if(aLethal && b > a) log(g, `${u.def.name}の必殺：${blk.def.name}を破壊`);
      if(bLethal && a > b) log(g, `${blk.def.name}の必殺：${u.def.name}を破壊`);
      if(aLethal || bLethal) g.stats.lethalHits = (g.stats.lethalHits || 0) + 1;
      // 変更2：相手とのバトルでの破壊（相打ち含む）も条件B。両者なら防御側から確認 [新B#1]
      if(blkDies) g.pendingB.add(d.idx);
      if(atkDies) g.pendingB.add(p.idx);
      if(atkDies) leaveField(g, u, 'trash', 'battle');
      if(blkDies) leaveField(g, blk, 'trash', 'battle');
    } else {
      if(blk) log(g, 'ブロッカーが場を離れたためライフへ');
      lifeHit = true;
    }
    clearMods(g, 'battle');                                         // 「このバトル中」はBP比較・破壊判定の後に消える
    if(g.pendingB.size){ g.battle.window = 'burst'; checkInv(g); upd(g); await flushBurstB(g); }
    if(lifeHit){
      d.life--; d.recovery++; g.stats.lifeHits++;
      log(g, `${d.name}のライフ−1（残り${d.life}）`);
      checkInv(g); upd(g);
      if(d.life <= 0) throw new GameOver(p.idx, 'life');
      g.battle.window = 'burst';
      await tryBurst(g, d, 'life_lost');                             // 7. ライフが減った側のバースト窓（条件A）
    }
    checkInv(g);
  } finally {
    clearMods(g, 'battle'); g.battle = null; upd(g);
  }
}

async function mainStep(g, p){
  for(let guard = 0; ; guard++){
    if(guard > 300) throw new FatalError('メインステップの行動数が異常');
    const act = await ask(g, p, 'main');
    if(!act || act.type === 'end') return;
    if(!['play', 'move', 'set', 'evolve'].includes(act.type)){ err(g, '不明な行動'); if(g.agents[p.idx].isCPU) return; continue; }
    try{ if(act.type === 'move') applyMove(g, p, act); else if(act.type === 'set') applySet(g, p, act); else if(act.type === 'evolve') applyEvolve(g, p, act); else await applyPlay(g, p, act, 'main'); }
    catch(e){ if(!(e instanceof RuleError)) throw e; err(g, `${p.name} 不正な行動：${e.message}`); if(g.agents[p.idx].isCPU) return; }
  }
}
async function attackStep(g, p){
  for(let guard = 0; ; guard++){
    if(guard > 60) throw new FatalError('アタック回数が異常');
    const act = await ask(g, p, 'attack');
    if(!act || act.type === 'end') return;
    const u = p.field.find(x => x.uid === act.uid && !x.tapped);
    if(!u){ err(g, `${p.name} アタックできないユニットを指定`); if(g.agents[p.idx].isCPU) return; continue; }
    await doAttack(g, p, u, act.target);
  }
}

// ---------- ターン（4-1） ----------
async function runTurn(g){
  const p = g.players[g.active];
  g.turn++; p.turnsTaken++;
  log(g, `── ターン${g.turn}：${p.name} ──`);
  g.phase = 'core';
  let added = 0;
  if(p.idx === g.first && p.turnsTaken === 1){
    log(g, 'コアステップ：先攻の最初のターンは新規オーブなし');   // 案B（2026-10-30）／4-1・シナリオ26
  } else {
    p.stock += 1; p.orbTotal += 1; added = 1;
    log(g, 'コアステップ：新規オーブ+1');
  }
  checkInv(g); upd(g);
  if(g.stepHook) await g.stepHook(g, p, 'core', {added});        // 表示のみ（処理の順番・中身は変えない）
  g.phase = 'draw';
  const n = (p.idx !== g.first && p.turnsTaken === 1) ? 2 : 1;
  const h0 = p.hand.length;
  drawN(g, p, n); log(g, `ドロー ${n}枚`); upd(g);
  if(g.stepHook) await g.stepHook(g, p, 'draw', {n, cards: p.hand.slice(h0)});
  g.phase = 'refresh';
  const untapped = p.field.filter(u => u.tapped).length;
  for(const u of p.field) u.tapped = false;
  const back = p.recovery; p.stock += back; p.recovery = 0;     // 変更1：回収待ちを全てストックへ
  log(g, `リフレッシュ：全ユニット回復／回収待ち${back}個→ストック`); upd(g);
  if(g.stepHook) await g.stepHook(g, p, 'refresh', {back, untapped});
  g.phase = 'main'; await mainStep(g, p);
  g.phase = 'attack';
  if(p.idx === g.first && p.turnsTaken === 1) log(g, '先攻の最初のターンはアタックできない（アタックステップなし）');   // 決定5／4-1
  else await attackStep(g, p);
  g.phase = 'end';
  clearMods(g, 'turn');
  g.active = 1 - g.active; upd(g);
}

function checkInv(g){
  for(const p of g.players){
    const tot = p.stock + p.recovery + p.life + unitOrbs(p);
    if(tot !== p.orbTotal) throw new FatalError(`${p.name} オーブ総数不一致（${tot}／想定${p.orbTotal}）`);
    if(p.stock < 0 || p.recovery < 0 || p.life < 0) throw new FatalError(`${p.name} 負の値`);
    if(p.field.length > 5) throw new FatalError(`${p.name} 場が6体以上`);
    for(const u of p.field) if(u.orbs < 1) throw new FatalError(`${p.name} オーブ0のユニットが場に残存`);
    const cards = p.deck.length + p.hand.length + p.field.length + p.trash.length + (p.area ? 1 : 0) + (p.burst ? 1 : 0);
    if(cards !== 36) throw new FatalError(`${p.name} カード総数不一致（${cards}）`);
  }
}

function newGame(o){
  const seed = (o.seed >>> 0);
  const g = {seed, rng: mulberry32(seed), uid: 1, turn: 0, active: 0, first: 0, phase: 'setup', players: [], battle: null,
    over: false, winner: null, reason: null, log: [], errors: [], agents: o.agents, onUpdate: o.onUpdate || null,
    delay: o.delay || null, stepHook: o.stepHook || null, logLimit: o.logLimit || 3000, pendingB: new Set(), burstDepth: 0,
    stats: {flashActions: 0, attacks: 0, aborted: 0, lifeHits: 0, capHits: 0, flashSummons: 0, moves: 0, fx: {}, plays: {}, flashPlays: {},
      burstSets: 0, burstChances: 0, burstFired: 0, burstDeclined: 0, burstNoTarget: 0, x3Summons: 0, burstFiredBy: {}, voidAdded: 0}};
  for(let i = 0; i < 2; i++){
    const p = {idx: i, name: o.names ? o.names[i] : 'P' + (i + 1), life: 5, stock: 4, recovery: 0,
      deck: [], hand: [], field: [], area: null, burst: null, trash: [], orbTotal: 9, turnsTaken: 0, evoUsed: 0, evoTurn: 0};
    const cards = (o.decks && o.decks[i]) || PRESETS[0].cards;
    const vd = validateDeck(cards); if(!vd.ok) throw new FatalError(`${p.name}のデッキが不正：${vd.errors.join('／')}`);
    for(const [id, n] of Object.entries(cards)) for(let k = 0; k < n; k++) p.deck.push(mkCard(g, id));
    p.deckName = (o.deckNames && o.deckNames[i]) || null;
    shuffle(g, p.deck);
    g.players.push(p);
  }
  g.first = g.rng() < 0.5 ? 0 : 1; g.active = g.first;
  for(const p of g.players) for(let k = 0; k < 4; k++) p.hand.push(p.deck.pop());
  log(g, `先攻：${g.players[g.first].name}`);
  return g;
}
async function runGame(g){
  try{
    while(!g.over){
      if(g.turn >= SETTINGS.turnCap) throw new FatalError(`ターン上限（${SETTINGS.turnCap}）に到達`);
      await runTurn(g);
    }
  }catch(e){
    if(e instanceof GameOver){ g.over = true; g.winner = e.winner; g.reason = e.reason;
      log(g, `勝者：${g.players[e.winner].name}（${e.reason === 'life' ? 'ライフ0' : 'ドロー失敗'}）`); }
    else { err(g, '異常終了：' + (e && e.message)); g.over = true; g.winner = null; g.reason = 'error'; g.fatal = String(e && e.stack || e); }
  }
  g.battle = null; g.phase = 'over'; upd(g);
  return g;
}

// ---------- CPU（9章） ----------
function pickBy(g, arr, f, wantMax){
  let best = null, out = [];
  for(const x of arr){ const v = f(x); if(best === null || (wantMax ? v > best : v < best)){ best = v; out = [x]; } else if(v === best) out.push(x); }
  return out.length ? out[Math.floor(g.rng() * out.length)] : null;   // 同点はランダム
}
const atkBp = (g, u) => bp(g, u) + ((u.def.effect && u.def.effect.kind === 'attack_bp_up') ? u.def.effect.value : 0);   // 宣言前の見込み（アタック時BP+込み）
const survives = (mine, theirs) => mine > theirs;   // 決定2：同値（相打ち）は負け扱い（正式）
// 必殺を含めた判定（v1.3）：相手が必殺なら生き残れない／自分が必殺なら必ず相手を破壊できる
const survU = (mine, theirs, theirU) => !hasKw(theirU, 'lethal') && mine > theirs;
const killsU = (mine, theirs, myU) => mine >= theirs || hasKw(myU, 'lethal');
const magicKind = (c, k) => c.def.type === 'magic' && c.def.effect && c.def.effect.kind === k;
const isFirstTurnOfFirst = (g, p) => p.idx === g.first && p.turnsTaken === 1;
function areaBonus(p, def){ const a = p.area && p.area.def.effect; return (a && a.kind === 'field_bp_up' && a.targetColor === def.color) ? a.value : 0; }
const blockable = (g, p) => p.field.filter(x => !x.tapped && !(g.battle && x.noBlockBattle === g.battle.id));

function cpuBlocker(g, p, att, cands){
  if(!cands.length) return null;
  const a = bp(g, att);
  const ok = cands.filter(u => survU(bp(g, u), a, att) && killsU(bp(g, u), a, u));
  if(ok.length) return pickBy(g, ok, u => bp(g, u), false);    // 勝てる最小
  const tie = cands.filter(u => !survU(bp(g, u), a, att) && killsU(bp(g, u), a, u));
  if(tie.length) return pickBy(g, tie, u => bp(g, u), false);  // 決定6：相打ちできる最小
  if(p.life >= 3) return null;                                 // 決定4：ライフ3以上で勝てる／相打ちにできるブロッカーなし → ライフで受ける
  return pickBy(g, cands, u => bp(g, u), false);              // 全員負ける → BP最小で受ける
}
// CPUの支払い：ストック → ユニットの余剰オーブ（レベルを下げない分）の順 [新#2]
function cpuPayFrom(g, p, def){
  let need = paymentFor(p, def) - p.stock; if(need <= 0) return null;
  const m = {};
  for(const u of [...p.field].sort((a, b) => surplus(b) - surplus(a))){
    const t = Math.min(Math.max(0, surplus(u)), need);
    if(t > 0){ m[u.uid] = t; need -= t; }
    if(!need) break;
  }
  return m;
}
const cpuCan = (g, p, c, timing, t) => checkPlay(g, p, c, timing, t, {allowUnits: 'surplus'}).ok;
function cpuTargets(g, p, c, t){
  const mx = maxTargetsOf(c.def.effect);
  if(t == null || mx <= 1) return t;
  const rest = targetCandidates(g, p, c.def.effect).filter(u => u.uid !== t).sort((a, b) => bp(g, b) - bp(g, a));

const Human = {

function subPromise(s){ return new Promise(res => { s.res = res; UI.sub = s; render(); }); }

// ターン開始ステップ：自分のターンは結果を見せてタップ待ち、CPUのターンはバナーだけ出して自動で進める
async function stepHook(g, p, step, info){
  if(p.idx === 0){
    if(step === 'core') UI.newCards = new Set();
    if(step === 'draw') info.cards.forEach(c => UI.newCards.add(c.uid));
    await waitFor('step', {step, info});
  } else {
    if(step === 'core') UI.newCards = new Set();
    UI.cpuBanner = {step, info};
    render();
    await sleep(step === 'refresh' ? 420 : 520);
    UI.cpuBanner = null; render();
  }
}

let rq = false;
function scheduleRender(){ if(rq) return; rq = true; requestAnimationFrame(() => { rq = false; render(); }); }
let animTimer = null;
function scheduleAnimRender(){ if(animTimer) return; animTimer = setTimeout(() => { animTimer = null; render(); }, 90); }

async function startBattle(){
  const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
  const slot = UI.decks.slots[UI.decks.selected];
  if(!CA.validateDeck(slot.cards).ok){ UI.sub = {type: 'deckpick'}; render(); return; }   // 36枚ちょうどでないと対戦できない
  const cpuIdx = Math.floor(Math.random() * CA.PRESETS.length);                          // CPUは初期の4レシピからランダム
  const g = CA.newGame({seed, agents: [Human, CA.CPU], names: ['あなた', 'CPU'], onUpdate: scheduleRender,
    delay: m => sleep(m === 'flash' ? 260 : 480), stepHook,
    decks: [slot.cards, CA.PRESETS[cpuIdx].cards], deckNames: [slot.name, CA.PRESETS[cpuIdx].name]});
  g.log.splice(0, 0, {t: 0, m: `あなたのデッキ：${slot.name}／CPUのデッキ：${CA.PRESETS[cpuIdx].name}`});
  Object.assign(UI, {g, pending: null, sub: null, screen: 'battle', cpuBanner: null, newCards: new Set(),
    fx: {}, ghosts: [], prevField: {}, prevLife: null, lastBattleId: null});
  render();
  await CA.runGame(g);
  if(UI.g !== g) return;
  const s = loadSave();
  if(g.reason !== 'error'){
    s.totalGames++;
    if(g.winner === 0){ s.totalWins++; s.streak++; s.maxStreak = Math.max(s.maxStreak, s.streak); } else s.streak = 0;
    writeSave(s);
  }
  UI.result = {won: g.winner === 0, reason: g.reason, turns: g.turn, life: [g.players[0].life, g.players[1].life], save: s, errors: g.errors.slice()};
  await sleep(500);
  UI.screen = 'result'; UI.pending = null; UI.sub = null; render();
}

async function humanPlay(uid){
  const g = UI.g, me = g.players[0], pend = UI.pending;
  if(!pend || (pend.kind !== 'main' && pend.kind !== 'flash')) return;
  const timing = pend.kind;
  const card = me.hand.find(c => c.uid === uid); if(!card) return;
  const chk = CA.checkPlay(g, me, card, timing, null);
  if(!chk.ok) return;
  let target = null;
  if(chk.cands){
    const mx = (card.def.effect.target && card.def.effect.target.maxTargets) || 1;
    target = await subPromise({type: 'pick', def: card.def, cands: chk.cands, cancel: true, multi: mx > 1 ? mx : 0, sel: []});
    if(target == null){ UI.sub = null; render(); return; }
  }
  let payFrom = null;
  if(chk.needUnits){
    payFrom = await subPromise({type: 'pay', need: chk.pay - me.stock, pay: chk.pay, alloc: {}, def: card.def});
    if(!payFrom){ UI.sub = null; render(); return; }
  }
  if(UI.pending !== pend) return;
  answer({type: 'play', uid, target, payFrom});
}

const COLOR_ORDER = {red: 0, blue: 1, green: 2, none: 3};
const TYPE_ORDER = {unit: 0, burst_unit: 1, magic: 2, area: 3, burst: 4};
const sortDefs = arr => arr.slice().sort((a, b) => (COLOR_ORDER[a.color] - COLOR_ORDER[b.color]) || (TYPE_ORDER[a.type] - TYPE_ORDER[b.type]) || (a.cost - b.cost) || a.id.localeCompare(b.id, 'en', {numeric: true}));
const FILTERS = {
  color: [['all', '全属性'], ['red', '紅'], ['blue', '蒼'], ['green', '翠'], ['none', '無']],
  type: [['all', '全種別'], ['unit', 'ユニット'], ['magic', 'マジック'], ['area', '領域'], ['burst', 'バースト']],
  cost: [['all', '全コスト'], ['0-2', '0〜2'], ['3', '3'], ['4', '4'], ['5', '5'], ['6+', '6以上']]
};
function passFilter(d, f){
  if(f.color !== 'all' && d.color !== f.color) return false;
  if(f.type === 'unit' && !CA.isUnitDef(d)) return false;
  if(f.type === 'burst' && !d.burst) return false;
  if((f.type === 'magic' || f.type === 'area') && d.type !== f.type) return false;
  if(f.cost === '0-2' && d.cost > 2) return false;
  if(f.cost === '6+' && d.cost < 6) return false;
  if(['3', '4', '5'].includes(f.cost) && d.cost !== +f.cost) return false;
  return true;
}

// カード型フレーム（場・手札・一覧・詳細で共通）
const costDots = n => '●'.repeat(n);
function cardFrame(d, o){
  o = o || {};
  const cls = ['cf', 'c-' + d.color, 'sz-' + (o.size || 'hand')];
  if(o.cls) cls.push(o.cls);
  // キーワードのラベル：場のユニットは「潜伏中」かどうかを反映（潜伏が解けたら潜伏ラベルは出さない）
  const kwList = d.keywords.filter(k => CA.KW_INFO[k] && !(o.unit && k === 'jinrai') && !(o.unit && k === 'stealth' && !o.stealth));
  if(o.unit && o.evolved) kwList.unshift('evo');
  const kws = kwList.length ? `<span class="kws">${kwList.map(k => k === 'evo' ? '<span class="kw kw-evo">進化</span>' : `<span class="kw kw-${k}">${o.unit && k === 'stealth' ? '潜伏中' : CA.KW_INFO[k].name}</span>`).join('')}</span>` : '';
  const art = `<div class="cf-art">${IMG[d.id] ? `<img src="${imgPath(d.id)}" alt="" draggable="false">` : `<span class="fb-k">${CJ[d.color]}</span><span class="fb-id">${d.id}</span>`}${kws}${o.orbs ? `<span class="cf-orbs">${'●'.repeat(o.orbs)}</span>` : ''}</div>`;
  let top, bot;
  if(o.unit){
    top = `<div class="cf-name">${esc(d.name)}</div>`;
    const max = d.levels.length;
    bot = `<div class="cf-bot"><span class="cf-bp${o.bpMod ? ' mod' : ''}">${o.bp}</span><span class="cf-lv" title="Lv${o.lv}">${'●'.repeat(o.lv)}${'○'.repeat(Math.max(0, max - o.lv))}</span></div>`;
    return `<div class="${cls.join(' ')}"${o.attrs || ''}>${top}${art}${bot}${o.extra || ''}</div>`;
  }
  top = `<div class="cf-top"><span class="cf-cost">${d.type === 'burst' ? '<span class="cf-bt">BURST</span>' : costDots(d.cost)}</span>${o.pay != null && o.pay !== d.cost ? `<span class="cf-pay">${o.pay}</span>` : ''}</div>`;
  const lvs = d.levels ? `<span class="cf-lv">${d.levels.map(L => L.lv === 1 ? '●' : '○').join('')}</span>` : '';
  bot = `<div class="cf-bot">${d.levels ? `<span class="cf-bp">${d.levels[0].bp}</span>${lvs}` : `<span class="cf-type">${CJ[d.color]}・${TYPEJ[d.type]}</span>`}</div>`;
  return `<div class="${cls.join(' ')}"${o.attrs || ''}>${top}${art}<div class="cf-name">${esc(d.name)}</div>${bot}${o.extra || ''}</div>`;
}

function trackChanges(g){
  const t = now(), on = UI.prefs.anim;
  if(g.battle && g.battle.id !== UI.lastBattleId){
    UI.lastBattleId = g.battle.id;
    if(on) UI.fx['u' + g.battle.attacker] = {cls: g.battle.atkOwner === 0 ? 'a-lunge-up' : 'a-lunge-down', t0: t, dur: 430};
  }
  const cur = {};
  for(const p of g.players) for(const u of p.field) cur[u.uid] = true;
  for(const [uid, info] of Object.entries(UI.prevField)){
    if(cur[uid] || !on) continue;
    const how = info.u.leftAs || '';
    const cls = how.endsWith(':hand') ? 'a-bounce' : 'a-dying';
    UI.ghosts.push({uid, owner: info.owner, idx: info.idx, html: info.html, cls, t0: t, dur: cls === 'a-dying' ? 470 : 390});
  }
  if(UI.prevLife && on) g.players.forEach((p, i) => { if(p.life < UI.prevLife[i]) UI.fx['life' + i] = {cls: 'a-shake', t0: t, dur: 430}; });
  UI.prevLife = g.players.map(p => p.life);
  UI.ghosts = UI.ghosts.filter(x => t - x.t0 < x.dur);
  for(const k of Object.keys(UI.fx)) if(t - UI.fx[k].t0 >= UI.fx[k].dur) delete UI.fx[k];
  if(UI.ghosts.length || Object.keys(UI.fx).length) scheduleAnimRender();
}
function fieldHtml(g, p, mine, store){
  const out = p.field.map((u, i) => {
    store[u.uid] = {u, owner: p.idx, idx: i, html: unitTile(g, u, mine, true)};
    return unitTile(g, u, mine, false);
  });
  const t = now();
  for(const x of UI.ghosts.filter(x => x.owner === p.idx)){
    const h = x.html.replace('class="cf ', `style="animation-delay:-${Math.round(t - x.t0)}ms" class="cf ghost ${x.cls} `).replace(/ data-a="[^"]*"/g, '');
    out.splice(Math.min(x.idx, out.length), 0, h);
  }
  return out.join('') || `<div class="fempty">${mine ? 'あなたの場' : '相手の場'}（ユニットなし）</div>`;
}
function battleBanner(g){
