          <span class="stepper"><button data-a="mvDec" data-uid="${u.uid}">−</button><span>${n}</span><button data-a="mvInc" data-uid="${u.uid}"${left > 0 ? '' : ' disabled'}>＋</button></span></div>`;
      }).join('');
      return sheet(`<h3>オーブ移動</h3><p class="note">メインステップ中は、ストック⇔ユニット、ユニット同士で自由に動かせます（−で外したオーブはストックへ戻り、別のユニットに＋で載せられます）。0個にしたユニットは自壊します。</p>
        <div class="metric"><span>ストック</span><b>${left}</b></div>${rows}
        <div class="btns"><button class="btn" data-a="cancel">やめる</button><button class="btn primary" data-a="mvOk">確定</button></div>`);
    }
    if(s.type === 'pickCard'){
      const me = g.players[0];
      return sheet(`<h3>${esc(s.title)}</h3><p class="note">${esc(s.note || '')}</p>` + me.hand.map(c =>
        `<button class="row" data-a="pcard" data-uid="${c.uid}"><span class="dot c-${c.def.color}"></span><span class="nm">${esc(c.def.name)}<small>コスト${c.def.cost}・${TYPEJ[c.def.type]}</small></span></button>`).join('') +
        `<div class="btns"><button class="btn" data-a="cancel">やめる</button></div>`);
    }
    if(s.type === 'trash'){
      const p = g.players[s.p];
      const list = p.trash.slice().reverse();
      return sheet(`<h3>${esc(p.name)}の捨て札（${list.length}枚）</h3><p class="note">新しい順</p>` +
        (list.length ? `<div class="grid">${list.map(c => cardFrame(c.def, {size: 'list'})).join('')}</div>` : '<p class="note">まだありません</p>') +
        `<div class="btns"><button class="btn" data-a="close">閉じる</button></div>`, true);
    }
    if(s.type === 'log') return sheet(`<h3>対戦ログ</h3><div class="logfull">${esc(g.log.map(l => l.m).join('\n'))}</div><div class="btns"><button class="btn" data-a="close">閉じる</button></div>`, true, 'logsheet');
    if(s.type === 'settings'){
      const opt = (v, t, d) => `<button class="row${UI.autoPass === v ? ' ok' : ''}" data-a="ap" data-v="${v}"><span class="nm">${UI.autoPass === v ? '● ' : '○ '}${t}<small>${d}</small></span></button>`;
      return sheet(`<h3>設定</h3>
        <p class="note">演出（アタックの動き・破壊時の揺れなど）</p>
        <button class="row" data-a="animToggle"><span class="nm">演出（アニメーション）<small>オフにすると演出なしで進みます</small></span><span class="toggle${UI.prefs.anim ? ' on' : ''}">${UI.prefs.anim ? 'オン' : 'オフ'}</span></button>
        <p class="note" style="margin-top:14px">自動パス：フラッシュ窓で、自分に優先権が来たときに確認を出すかどうか</p>
        ${opt(1, '1：常に確認', '毎回フラッシュ画面を出す')}
        ${opt(2, '2：使える行動があるときだけ確認（標準）', '使えるカード・効果がなければ自動でパス')}
        ${opt(3, '3：負けに直結する場面だけ確認', '防御側でライフ1、このままだとライフに通るときだけ（仮の定義）')}
        <div class="btns"><button class="btn" data-a="close">閉じる</button></div>`);
    }
    if(s.type === 'deckpick'){
      const rows = UI.decks.slots.map((sl, i) => { const v = CA.validateDeck(sl.cards);
        return v.ok ? `<button class="row${UI.decks.selected === i ? ' ok' : ''}" data-a="deckGo" data-i="${i}"><span class="nm">${i + 1}. ${esc(sl.name)}<small>${v.count}枚</small></span><span class="tag">このデッキで対戦</span></button>`
                    : `<div class="row ng"><span class="nm">${i + 1}. ${esc(sl.name)}</span><span class="rs">${v.count}枚：${CA.DECK_SIZE}枚ちょうどでないため対戦できません</span></div>`; }).join('');
      return sheet(`<h3>使うデッキを選ぶ</h3><p class="note">CPUは4つの初期プリセットから、ランダムに1つを使います。</p>${rows}
        <div class="btns"><button class="btn" data-a="decks">デッキを編集する</button><button class="btn" data-a="close">やめる</button></div>`);
    }
    if(s.type === 'deckConfirm'){
      return sheet(`<h3>${esc(s.title)}</h3><p class="note">${esc(s.note)}</p><div class="btns"><button class="btn" data-a="close">やめる</button><button class="btn primary" data-a="deckConfirmOk">${esc(s.ok)}</button></div>`);
    }
    if(s.type === 'stats'){
      const v = loadSave();
      return sheet(`<h3>戦績</h3><dl class="kv"><dt>総勝利数</dt><dd>${v.totalWins}</dd><dt>総対戦数</dt><dd>${v.totalGames}</dd><dt>最大連勝</dt><dd>${v.maxStreak}</dd><dt>現在の連勝</dt><dd>${v.streak}</dd></dl><div class="btns"><button class="btn" data-a="close">閉じる</button></div>`);
    }
  }
  if(!pend || UI.screen !== 'battle') return '';
  if(pend.kind === 'step') return stepOverlay(g, pend.data);
  if(pend.kind === 'burst'){
    const d = pend.data.def;
    return sheet(`<h3>バースト発動？（条件${pend.data.cond}）</h3><p class="note">${pend.data.cond === 'A' ? 'あなたのライフが減りました。' : 'あなたのユニットが相手によって場を離れました。'}発動しなければ、セットしたまま残ります。発動中は相手は割り込めません。</p>
      <div class="eff"><b>${esc(d.name)}</b><br>${esc(CA.describe(d).map(x => x.t).join(' '))}</div>
      <div class="btns"><button class="btn" data-a="bNo">発動しない</button><button class="btn primary" data-a="bYes">発動する</button></div>`);
  }
  if(pend.kind === 'burstSummon'){
    const d = pend.data.def;
    return sheet(`<h3>${esc(d.name)}を無料で召喚する？</h3><p class="note">ストックからオーブ1個を載せて召喚します。召喚しない場合は手札に戻ります。</p>
      <div class="btns"><button class="btn" data-a="bNo">召喚しない（手札へ）</button><button class="btn primary" data-a="bYes">召喚する</button></div>`);
  }
  if(pend.kind === 'target'){
    return sheet(`<h3>${esc(pend.data.def.name)}：${pend.data.def.burst && !CA.isUnitDef(pend.data.def) ? 'バーストの対象' : '召喚時効果の対象'}</h3><p class="note">${esc(CA.effText(pend.data.def.effect))}</p>` + pend.data.cands.map(u => targetRow(g, u, 'tgtE')).join(''));
  }
  if(pend.kind === 'block'){
    const att = pend.data.att, A = CA.bp(g, att), me = g.players[0];
    const rows = pend.data.cands.map(u => {
      const v = CA.bp(g, u); const res = v > A ? '勝ち' : v === A ? '相打ち' : '負け';
      return `<button class="row${v > A ? ' ok' : ''}" data-a="blk" data-uid="${u.uid}"><span class="dot c-${u.def.color}"></span><span class="nm">${esc(u.def.name)}<small>BP${v}・Lv${CA.level(u)}</small></span><span class="tag"${v > A ? '' : ' style="color:var(--danger)"'}>${res}</span></button>`;
    }).join('');
    return sheet(`<h3>ブロック宣言</h3><p class="note">相手の ${esc(att.def.name)}（BP${A}）がアタック中。ブロックしたユニットも疲労します。</p>${rows}
      <button class="pass" data-a="blk" data-uid="none">ブロックしない（ライフ−1 → 残り${me.life - 1}）</button>`);
  }
  if(pend.kind === 'flash'){
    const me = g.players[0], b = g.battle, w = pend.data.w;
    const att = CA.findUnit(g, b.attacker), blk = b.blocker ? CA.findUnit(g, b.blocker) : null;
    const role = me.idx === b.atkOwner ? '攻撃側' : '防御側';
    const list = me.hand.map(c => ({c, k: CA.checkPlay(g, me, c, 'flash', null)})).sort((x, y) => (y.k.ok ? 1 : 0) - (x.k.ok ? 1 : 0));
    const rows = list.map(({c, k}) => k.ok
      ? `<button class="row ok" data-a="use" data-uid="${c.uid}"><span class="dot c-${c.def.color}"></span><span class="nm">${esc(c.def.name)}<small>${CA.isUnitDef(c.def) ? `迅雷で召喚・BP${c.def.levels[0].bp}` + (c.def.effect ? '・' : '') : ''}${esc(CA.effText(c.def.effect))}</small></span><span class="tag">支払い${k.pay}</span></button>`
      : `<div class="row ng"><span class="dot c-${c.def.color}"></span><span class="nm">${esc(c.def.name)}</span><span class="rs">${esc(k.reason)}</span></div>`).join('');
    const fxRows = me.field.filter(u => u.def.flashEffect).map(u => { const k = CA.checkFx(g, me, u); return k.ok
      ? `<button class="row ok" data-a="fx" data-uid="${u.uid}"><span class="dot c-${u.def.color}"></span><span class="nm">場：${esc(u.def.name)}の効果<small>${esc(CA.effText(u.def.flashEffect))}</small></span><span class="tag">無料</span></button>`
      : `<div class="row ng"><span class="dot c-${u.def.color}"></span><span class="nm">場：${esc(u.def.name)}の効果</span><span class="rs">${esc(k.reason)}</span></div>`; }).join('');
    return sheet(`<h3>フラッシュ ${w}<span style="font-size:12px;color:var(--muted);font-weight:400">　${w === 'W1' ? 'ブロック宣言の前' : 'ブロック宣言の後・解決の前'}</span></h3>
      <p class="note">あなたに優先権（${role}）。行動すると優先権は相手へ。両者が続けてパスすると窓が閉じます。</p>
      <div class="vs"><div><b>アタッカー（${g.players[b.atkOwner].name}）</b>${att ? esc(att.def.name) : '—'}<div class="big">${att ? CA.bp(g, att) : '—'}</div></div>
        <div><b>${b.guard ? '守護（バトル相手）' : 'ブロッカー'}</b>${blk ? esc(blk.def.name) : (b.blocker ? '離脱' : (w === 'W1' ? '未宣言' : 'なし'))}<div class="big">${blk ? CA.bp(g, blk) : '—'}</div></div></div>
      ${b.guard ? '<p class="note">守護とのバトルなので、ブロック宣言はありません。守護が場を離れるとアタックは不成立になります。</p>' : ''}
      ${fxRows}${rows || '<p class="note">手札なし</p>'}
      <button class="pass" data-a="pass">パス</button>`);
  }
  return '';
}
function targetRow(g, u, a){
  const own = g.players[u.owner].name;
  return `<button class="row ok" data-a="${a || 'tgt'}" data-uid="${u.uid}"><span class="dot c-${u.def.color}"></span><span class="nm">${esc(u.def.name)}<small>${esc(own)}・BP${CA.bp(g, u)}・Lv${CA.level(u)}${u.tapped ? '・疲労' : ''}</small></span></button>`;
}
function sheet(inner, full, id){ return `<div class="ov" data-a="ovbg"><div class="sheet${full ? ' full' : ''}"${id ? ` id="${id}"` : ''}>${inner}</div></div>`; }

// ---------- 操作 ----------
const H = {
  start(){ UI.sub = {type: 'deckpick'}; render(); },
  deckGo(el){ UI.decks.selected = +el.dataset.i; saveDecks(); UI.sub = null; startBattle(); },
  decks(){ UI.screen = 'decks'; UI.sub = null; render(); },
  deckUse(el){ UI.decks.selected = +el.dataset.i; saveDecks(); render(); },
  deckEdit(el){ openDeckEdit(+el.dataset.i); },
  deckReset(el){ const i = +el.dataset.i; UI.sub = {type: 'deckConfirm', title: `スロット${i + 1}を初期状態に戻す`, note: `名前と中身を、初期プリセット「${CA.PRESETS[i].name}」に戻して保存します。`, ok: '初期状態に戻す',
    run: () => { UI.decks.slots[i] = CA.presetSlot(i); saveDecks(); UI.deckNotice = ''; }}; render(); },
  deckConfirmOk(){ const s = UI.sub; UI.sub = null; if(s && s.run) s.run(); render(); },
  deckFilter(el){ UI.edit.filter[el.dataset.k] = el.dataset.v; render(); },
  deckInc(el){ const e = UI.edit, id = el.dataset.id, n = e.cards[id] || 0;
    if(n >= CA.SAME_MAX || CA.deckCount(e.cards) >= CA.DECK_SIZE) return;   // 同名3枚・36枚を超える操作はできない
    e.cards[id] = n + 1; render(); },
  deckDec(el){ const e = UI.edit, id = el.dataset.id; if(e.cards[id] > 0){ e.cards[id]--; if(!e.cards[id]) delete e.cards[id]; render(); } },
  deckCard(el){ UI.sub = {type: 'detail', html: cardDetail(CA.DEF[el.dataset.id])}; render(); },
  deckPreset(){ const e = UI.edit; e.cards = Object.assign({}, CA.PRESETS[e.slot].cards); e.name = CA.PRESETS[e.slot].name; render(); },
  deckSave(){ const e = UI.edit; if(!CA.validateDeck(e.cards).ok || !e.name.trim()) return;
    UI.decks.slots[e.slot] = {name: e.name.trim().slice(0, 16), cards: CA.cleanCards(e.cards)}; saveDecks(); UI.deckNotice = ''; UI.edit = null; UI.screen = 'decks'; render(); },
  deckCancel(){ if(editDirty()){ UI.sub = {type: 'deckConfirm', title: '編集をやめる', note: '保存していない変更は消えます。', ok: '変更を捨てる', run: () => { UI.edit = null; UI.screen = 'decks'; }}; render(); }
    else { UI.edit = null; UI.screen = 'decks'; render(); } },
  title(){ UI.screen = 'title'; UI.sub = null; UI.g = null; UI.pending = null; UI.cpuBanner = null; render(); },
  cards(){ UI.screen = 'cards'; render(); },
  stats(){ UI.sub = {type: 'stats'}; render(); },
  tutorial(){ openTutorial('title'); },
  tutNext(){ if(UI.tut.i < TUT.length - 1){ UI.tut.i++; render(); } else closeTutorial(); },
  tutPrev(){ if(UI.tut.i > 0){ UI.tut.i--; render(); } },
  tutSkip(){ closeTutorial(); },
  logo(){
    const t = Date.now(); UI.logoTaps = UI.logoTaps.filter(x => t - x < 3000); UI.logoTaps.push(t);
    if(UI.logoTaps.length >= 5){ UI.logoTaps = []; UI.screen = 'sim'; render(); }
  },
  carddef(el){ UI.sub = {type: 'detail', html: cardDetail(CA.DEF[el.dataset.id])}; render(); },
  stepNext(){ if(UI.pending && UI.pending.kind === 'step') answer(); },
  trash(el){ if(UI.g){ UI.sub = {type: 'trash', p: +el.dataset.p}; render(); } },
  animToggle(){ UI.prefs.anim = !UI.prefs.anim; savePrefs(); if(!UI.prefs.anim){ UI.fx = {}; UI.ghosts = []; } render(); },
  hand(el){
    const g = UI.g, me = g.players[0], uid = +el.dataset.uid, c = me.hand.find(x => x.uid === uid); if(!c) return;
    const pend = UI.pending;
    const extra = c.def.type !== 'burst' ? `<dt>今の支払い</dt><dd>${CA.paymentFor(me, c.def)}（軽減${CA.reductionOf(me, c.def)}）</dd>` : '';
    let actions = '';
    if(pend && (pend.kind === 'main' || pend.kind === 'flash')){
      const k = CA.checkPlay(g, me, c, pend.kind, null);
      const ks = c.def.burst && pend.kind === 'main' ? CA.checkSet(g, me, c) : null;
      const bt = [];
      if(k.ok) bt.push(`<button class="btn primary" data-a="use" data-uid="${uid}">${CA.isUnitDef(c.def) ? '召喚する' : c.def.type === 'area' ? '設置する' : '使う'}</button>`);
      if(ks && ks.ok) bt.push(`<button class="btn" data-a="setb" data-uid="${uid}">バーストとしてセット</button>`);
      actions = (bt.length ? `<div class="btns">${bt.join('')}</div>` : '') +
        (!k.ok && c.def.type !== 'burst' ? `<p class="note warn">使えない：${esc(k.reason)}</p>` : '') +
        (ks && !ks.ok ? `<p class="note warn">セットできない：${esc(ks.reason)}</p>` : '');
    }
    UI.sub = {type: 'detail', html: cardDetail(c.def, extra), actions}; render();
  },
  unit(el){
    const g = UI.g, u = CA.findUnit(g, +el.dataset.uid); if(!u) return;
    const mods = u.mods.map(m => `+${m.value}（${m.until === 'turn' ? 'このターン' : 'このバトル'}）`).join('、') || 'なし';
    const owner = g.players[u.owner];
    const evoTxt = u.evolved ? `進化済み（BP+${CA.EVOLVE.bpBonus}、場にいる間ずっと有効）` : '未進化';
    const extra = `<dt>持ち主</dt><dd>${esc(owner.name)}</dd><dt>現在</dt><dd>Lv${CA.level(u)}・BP${CA.bp(g, u)}・オーブ${u.orbs}${u.tapped ? '・疲労' : ''}${u.stealth ? '・潜伏中' : (u.def.keywords.includes('stealth') ? '・潜伏は解けている' : '')}</dd><dt>BP修正</dt><dd>${mods}</dd><dt>進化</dt><dd>${evoTxt}</dd>`;
    let actions = '';
    if(u.owner === 0 && UI.pending && UI.pending.kind === 'main' && !u.evolved){
      const k = CA.checkEvolve(g, owner, u);
      actions = k.ok ? `<div class="btns"><button class="btn primary" data-a="evolve" data-uid="${u.uid}">進化する（BP+${CA.EVOLVE.bpBonus}・無料／残り${CA.EVOLVE.maxUses - owner.evoUsed}回）</button></div>`
                     : `<p class="note warn">進化できない：${esc(k.reason)}</p>`;
    }
    UI.sub = {type: 'detail', html: cardDetail(u.def, extra), actions}; render();
  },
  areainfo(el){ const p = UI.g.players[+el.dataset.p]; if(p.area){ UI.sub = {type: 'detail', html: cardDetail(p.area.def)}; render(); } },
  use(el){ humanPlay(+el.dataset.uid); },
  setb(el){ if(UI.pending && UI.pending.kind === 'main') answer({type: 'set', uid: +el.dataset.uid}); },
  evolve(el){ if(UI.pending && UI.pending.kind === 'main') answer({type: 'evolve', uid: +el.dataset.uid}); },
  burstinfo(){ const p = UI.g.players[0]; if(p.burst){ UI.sub = {type: 'detail', html: cardDetail(p.burst.def, '<dt>状態</dt><dd>裏向きでセット中</dd>')}; render(); } },
  bYes(){ if(UI.pending && (UI.pending.kind === 'burst' || UI.pending.kind === 'burstSummon')) answer(true); },
  bNo(){ if(UI.pending && (UI.pending.kind === 'burst' || UI.pending.kind === 'burstSummon')) answer(false); },
  settings(){ UI.sub = {type: 'settings'}; render(); },
  ap(el){ UI.autoPass = +el.dataset.v; const s = loadSave(); s.autoPass = UI.autoPass; writeSave(s); render(); },
  async fx(el){
    const g = UI.g, me = g.players[0], pend = UI.pending; if(!pend || pend.kind !== 'flash') return;
    const u = me.field.find(x => x.uid === +el.dataset.uid); if(!u || !CA.checkFx(g, me, u).ok) return;
    let discard;
    if(u.def.flashEffect.kind === 'discard_draw'){
      discard = await subPromise({type: 'pickCard', title: `${u.def.name}：捨てるカードを選ぶ`, note: me.deck.length ? '捨てた後に1枚引きます。' : '山札が0枚です。引けないとその場で敗北します。'});
      if(discard == null){ UI.sub = null; render(); return; }
    }
    let target;
    const f = u.def.flashEffect;
    if(f.target){
      const k = CA.checkFx(g, me, u);
      target = await subPromise({type: 'pick', title: `${u.def.name}：対象を選ぶ`, note: CA.effText(f), cands: k.cands, cancel: true});
      if(target == null){ UI.sub = null; render(); return; }
    }
    if(UI.pending !== pend) return;
    answer({type: 'fx', uid: u.uid, discard, target});
  },
  pcard(el){ const s = UI.sub; if(s && s.type === 'pickCard'){ UI.sub = null; s.res(+el.dataset.uid); } },
  async move(){
    const g = UI.g, me = g.players[0], pend = UI.pending; if(!pend || pend.kind !== 'main' || !me.field.length) return;
    const dist = {}; for(const u of me.field) dist[u.uid] = u.orbs;
    const r = await subPromise({type: 'move', dist});
    if(!r){ UI.sub = null; render(); return; }
    if(UI.pending !== pend) return;
    answer({type: 'move', dist: r});
  },
  mvInc(el){ const s = UI.sub, me = UI.g.players[0]; if(!s || s.type !== 'move') return;
    const delta = me.field.reduce((a, u) => a + (s.dist[u.uid] - u.orbs), 0);
    if(me.stock - delta > 0){ s.dist[+el.dataset.uid]++; render(); } },
  mvDec(el){ const s = UI.sub; if(!s || s.type !== 'move') return; const k = +el.dataset.uid; if(s.dist[k] > 0){ s.dist[k]--; render(); } },
  mvOk(){ const s = UI.sub; if(!s || s.type !== 'move') return; UI.sub = null; s.res(Object.assign({}, s.dist)); },
  toAttack(){ if(UI.pending && UI.pending.kind === 'main') answer({type: 'end'}); },
  endTurn(){ if(UI.pending && UI.pending.kind === 'attack') answer({type: 'end'}); },
  async atk(el){
    const pend = UI.pending; if(!pend || pend.kind !== 'attack') return;
    const g = UI.g, uid = +el.dataset.uid, guards = CA.activeGuardians(g.players[1]);
    let target;
    if(guards.length === 1) target = guards[0].uid;
    else if(guards.length > 1){
      target = await subPromise({type: 'pick', title: 'バトルする守護を選ぶ', note: '相手に守護がいるため、ライフへはアタックできません。守護ユニット1体を選んでバトルします。', cands: guards, cancel: true});
      if(target == null){ UI.sub = null; render(); return; }
    }
    if(UI.pending !== pend) return;
    answer({type: 'attack', uid, target});
  },
  blk(el){ if(UI.pending && UI.pending.kind === 'block') answer(el.dataset.uid === 'none' ? null : +el.dataset.uid); },
  pass(){ if(UI.pending && UI.pending.kind === 'flash') answer({type: 'pass'}); },
  tgt(el){ const s = UI.sub; if(s && s.type === 'pick'){ UI.sub = null; s.res(+el.dataset.uid); } },
  tgtSel(el){ const s = UI.sub; if(!s || s.type !== 'pick' || !s.multi) return; const k = +el.dataset.uid;
    if(s.sel.includes(k)) s.sel = s.sel.filter(x => x !== k); else if(s.sel.length < s.multi) s.sel.push(k); render(); },
  tgtOk(){ const s = UI.sub; if(!s || s.type !== 'pick' || !s.multi || !s.sel.length) return; UI.sub = null; s.res(s.sel.slice()); },
  tgtE(el){ if(UI.pending && UI.pending.kind === 'target') answer(+el.dataset.uid); },
  cancel(){ const s = UI.sub; UI.sub = null; if(s && s.res) s.res(null); render(); },
  close(){ UI.sub = null; render(); },
  ovbg(el, e){ if(e.target === el && UI.sub && ['detail', 'log', 'stats', 'trash', 'deckpick'].includes(UI.sub.type)){ UI.sub = null; render(); } },
  log(){ if(UI.g){ UI.sub = {type: 'log'}; render(); const el = document.getElementById('logsheet'); if(el) el.scrollTop = el.scrollHeight; } },
  payInc(el){ const s = UI.sub, me = UI.g.players[0], u = me.field.find(x => x.uid === +el.dataset.uid); if(!s || !u) return;
    const sum = Object.values(s.alloc).reduce((a, b) => a + b, 0); const n = s.alloc[u.uid] || 0;
    if(n < u.orbs && sum < s.need){ s.alloc[u.uid] = n + 1; render(); } },
  payDec(el){ const s = UI.sub; const k = +el.dataset.uid; if(s && s.alloc[k]){ s.alloc[k]--; render(); } },
  payOk(){ const s = UI.sub; if(!s) return; const sum = Object.values(s.alloc).reduce((a, b) => a + b, 0); if(sum !== s.need) return; UI.sub = null; s.res(Object.assign({}, s.alloc)); },
  async simrun(){
    const s = UI.sim; if(s.running) return;
    s.seed = parseInt(document.getElementById('simSeed').value, 10) || 0;
    s.games = Math.max(1, Math.min(5000, parseInt(document.getElementById('simGames').value, 10) || 100));
    s.running = true; s.done = 0; s.res = null; render();
    try{
      s.decks = [0, 1].map(k => { const v = document.getElementById('simDeck' + k).value; return v === 'random' ? 'random' : +v; });
      s.res = await CA.runSim({seed: s.seed, games: s.games, decks: s.decks, onProgress: async (n) => { s.done = n; render(); await sleep(0); }});
    } finally { s.running = false; render(); }
  }
};
$app.addEventListener('input', e => {
  if(e.target.id === 'deckName' && UI.edit){ UI.edit.name = e.target.value;
    const b = document.querySelector('[data-a=deckSave]'); if(b) b.disabled = !(CA.validateDeck(UI.edit.cards).ok && UI.edit.name.trim()); }
});
$app.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if(!el) return;
  const fn = H[el.dataset.a]; if(fn) fn(el, e);
});
UI.prefs = loadPrefs();
loadDecks();
UI.autoPass = [1, 2, 3].includes(loadSave().autoPass) ? loadSave().autoPass : 2;
preloadImages();
if(location.hash === '#sim') UI.screen = 'sim';
else if(!UI.prefs.tutorialSeen) openTutorial('title');   // 初回起動時のみ自動表示
render();
})();
</script>
</body>
